rição</th><th>O que fazer?</th></tr></thead>\n<tbody>\n<tr><td>Sucesso</td><td>O sistema conseguiu baixar ao menos uma nota (entrada ou saída).</td><td>Nenhuma ação necessária.</td></tr>\n<tr><td>Em execução</td><td>A baixa da nota está sendo processada naquele momento.</td><td>Aguardar a conclusão.</td></tr>\n<tr><td>Aguardando execução</td><td>A fila de processamento diário foi iniciada.</td><td>Aguardar a conclusão.</td></tr>\n<tr><td>Reagendado</td><td>O sistema não conseguiu baixar as notas e tentará novamente automaticamente.</td><td>Monitorar; se persistir, verifique o certificado e as configurações.</td></tr>\n<tr><td>Erro</td><td>Ocorreu uma inconsistência não mapeada.</td><td>Contate o suporte informando a empresa e a competência.</td></tr>\n<tr><td>Certificado vencido</td><td>O certificado digital da empresa está vencido.</td><td>Renove o certificado e recadastre-o no sistema.</td></tr>\n</tbody>\n</table>\n<p><b>Colunas Entradas e Saídas</b> — status de cada processo: 🟢 verde = NF-e baixada com sucesso · 🔴 vermelha = inconsistência na baixa · ⚫ cinza = sem NF-e na competência.</p>\n<h2>🛠️ Configurações necessárias</h2>\n<p>Para o sistema baixar as notas, é preciso configurar o certificado digital da empresa:</p>\n<ol>\n<li>Acesse <b>Cadastro › Certificados</b>.</li>\n<li>Adicione um novo certificado ou edite um existente.</li>\n<li>Na aba <b>Dados</b>, adicione o certificado digital <b>A1</b> e vincule-o à empresa correspondente.</li>\n<li>Na aba <b>Rotinas Vinculadas</b>, na esfera <b>Estadual</b>, selecione a rotina <b>Sefaz</b> e defina o estado da empresa.</li>\n<li>Clique no <b>check</b> e em <b>Salvar</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/344601-2026-06-12%2015-48-07%20%281%29.gif\" alt=\"Configuração do certificado para NF-e\">\n<div class=\"bad\">⚠️ <b>Regras do certificado:</b> não é permitido usar procuração; o certificado deve ser da própria empresa selecionada; em matriz e filial, cadastre um certificado por empresa (o vínculo é por CNPJ — o da matriz não vale para a filial e vice-versa); empresas sem certificado cadastrado não terão as notas consultadas.</div>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "NFS-e", "h": "<h2>📌 Visão geral</h2>\n<p>O módulo <b>NFS-e</b> do Automation disponibiliza as notas de serviço eletrônicas (NFS-e) emitidas na competência atual das prefeituras brasileiras. As consultas são feitas automaticamente, todos os dias. Além do download das notas, a ferramenta também realiza o encerramento em algumas prefeituras.</p>\n<p>📅 O <b>encerramento e a geração de guias</b> ocorrem entre os dias <b>1 e 10</b> do mês atual, sempre referentes ao mês anterior (executando em junho, baixa as guias de maio). A <b>baixa dos XMLs</b> é diária, do dia 10 do mês corrente até o dia 1 do mês seguinte, feita exclusivamente pelo Portal Nacional.</p>\n<h2>📊 Dashboard NFS-e</h2>\n<p>Acesse por <b>Dashboards › NFS-e</b> para uma visão geral da execução e da baixa das notas de serviço do Portal Nacional. Informações disponíveis:</p>\n<ul>\n<li><b>Empresas monitoradas</b> — com configuração para busca via Portal Nacional e prefeitura.</li>\n<li><b>Empresas não monitoradas</b> — sem definição para baixar no Portal Nacional ou prefeitura.</li>\n<li><b>Certificado</b> — total de certificados vinculados, com quantos vencem em 30 dias e quantos estão vencidos/revogados ou com problemas.</li>\n<li><b>Total de arquivos baixados e tempo poupado</b>.</li>\n<li><b>Gráficos</b> — quantidade por status de execução e NFS-e baixadas (Prestadas × Tomadas; Autorizadas, Canceladas e Integradas).</li>\n<li><b>Detalhamento por empresa</b> — quantidade de notas, situação, valores contábeis e de retenção, e status de integração por nota.</li>\n</ul>\n<h2>🖥️ Tela NFS-e</h2>\n<p>Acesse por <b>Fiscal › Notas › NFS-e</b>. Opções de busca: Razão Social ou CNPJ/CPF, Status, Competência inicial e final, <b>Configuração › Configuração por Município</b> e <b>Baixa em Lote</b>.</p>\n<p>A lista exibe: Status de execução, Competência, Status por processo (Prestados, Tomados e Diversos), Status de integração (coluna Api XML — exclusivo Domínio e DomínioWeb), Última consulta e Ações.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/344939-1781528393242.png\" alt=\"Tela NFS-e\">\n<h2>📊 Detalhamento dos status</h2>\n<table>\n<thead><tr><th>Status</th><th>Descrição</th><th>O que fazer?</th></tr></thead>\n<tbody>\n<tr><td>Sucesso</td><td>Arquivos da empresa foram baixados devidamente.</td><td>Nenhuma ação necessária.</td></tr>\n<tr><td>Atenção</td><td>Necessita validação da contabilidade; pode exigir manutenção.</td><td>Verifique a mensagem do sistema; se preciso, contate o suporte informando o detalhe.</td></tr>\n<tr><td>Erro</td><td>Ocorreu uma inconsistência não mapeada.</td><td>Contate o suporte informando a empresa e a competência.</td></tr>\n<tr><td>Reagendado</td><td>Não conseguiu baixar e tentará novamente automaticamente.</td><td>Monitorar; se persistir, verifique o certificado e as configurações.</td></tr>\n<tr><td>Em execução</td><td>A empresa está sendo processada naquele momento.</td><td>Aguardar a conclusão.</td></tr>\n<tr><td>Aguardando execução</td><td>A fila de processamento diário foi iniciada.</td><td>Aguardar a conclusão.</td></tr>\n</tbody>\n</table>\n<p><b>Colunas Prestados, Tomados e Diversos</b>: 🟢 verde = baixados com sucesso · 🟠 laranja = inconsistência · ⚫ cinza = sem arquivos na competência.</p>\n<p><b>Coluna API XML</b> (integração Domínio/DomínioWeb): 🔄 em execução (aguardando retorno) · ✅ integrado · ❌ inconsistência · 🔑 sem chave de integração · ⚫ sem notas.</p>\n<h2>🛠️ Configurações necessárias</h2>\n<h3>🌐 Nota Nacional</h3>\n<p>A busca dos XMLs é feita exclusivamente pelo Portal Nacional, por <b>certificado digital da própria empresa</b>:</p>\n<ol>\n<li>Acesse <b>Cadastro › Certificados</b>.</li>\n<li>Adicione ou edite um certificado.</li>\n<li>Na aba <b>Dados</b>, adicione o certificado <b>A1</b> e vincule-o à empresa.</li>\n<li>Na aba <b>Rotinas Vinculadas</b>, na esfera <b>Municipal</b>, selecione a rotina <b>Nota Nacional</b>.</li>\n<li>Clique no <b>check</b> e em <b>Salvar</b>.</li>\n</ol>\n<div class=\"bad\">⚠️ Somente <b>um certificado por empresa</b>; deve ser da própria empresa (sem procuração); em matriz e filial, cadastre um por CNPJ.</div>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/344940-cert%20nfse%20nota%20nacional.gif\" alt=\"Certificado Nota Nacional\">\n<h3>🏛️ Acesso por prefeitura</h3>\n<p>A forma de acesso varia por município — consulte a <a href=\"https://docs.google.com/spreadsheets/d/17OcjveEx6w7Fy4-z-zgWlHgmsWMbiqLDz8sqJn5MnjY/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\">planilha de cidades homologadas</a>. As formas disponíveis são:</p>\n<p><b>1. Certificado digital</b> — em <b>Cadastro › Certificados</b>, aba Dados adicione o A1 e vincule as empresas (com procuração, é possível vincular várias); na aba Rotinas Vinculadas, esfera Municipal, selecione <b>NFS-e</b> e defina o município.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/344941-cert%20iss%20.gif\" alt=\"Certificado ISS por prefeitura\">\n<p><b>2. Login e senha do contador (por procuração)</b> — em <b>Cadastro › Contador</b>, aba Dados preencha e vincule as empresas com procuração; na aba Senhas de Acesso, esfera Municipal, rotina <b>NFS-e</b>, defina o município e informe login e senha.</p>\n<div class=\"bad\">⚠️ <b>Sistema Betha:</b> o acesso usa uma URL única, sem identificador de prefeitura — o sistema considera todas as empresas vinculadas ao contador como Betha. Vincule ao contador apenas as empresas que realmente usam o Betha.</div>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/344942-contador.gif\" alt=\"Acesso por contador\">\n<p><b>3. Login e senha da empresa</b> — em <b>Cadastro › Empresas</b>, selecione a empresa; na aba Senhas de Acesso, esfera Municipal, rotina <b>NFS-e</b>, defina o município e informe login e senha.</p>\n<div class=\"ok\">ℹ️ O sistema escolhe automaticamente a credencial conforme o cenário, seguindo a ordem: 1) login/senha da <b>empresa</b>; 2) login/senha do <b>contador</b>; 3) <b>certificado digital</b>.</div>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/344943-empresa.gif\" alt=\"Acesso por empresa\">\n<h3>⚙️ Configuração por município</h3>\n<ol>\n<li>Clique na <b>engrenagem</b> ao lado de <b>Em Lote</b>.</li>\n<li>Clique em <b>Novo</b>.</li>\n<li>Defina os parâmetros por município e clique em <b>Salvar</b>.</li>\n</ol>\n<div class=\"bad\">⚠️ Algumas prefeituras têm configurações adicionais e parâmetros distintos (ex.: sistemas IPM e Simpliss). Sem configuração definida, o sistema faz a busca padrão, trazendo todos os arquivos homologados.</div>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/344953-municipio.gif\" alt=\"Configuração por município\">\n<h3>🔗 Integração com Domínio</h3>\n<p>Se o escritório usa <b>Domínio</b> ou <b>DomínioWeb</b>, o módulo NFS-e envia os documentos automaticamente para o sistema contábil na hora em que as notas são baixadas:</p>\n<ol>\n<li>Em <b>Configuração › Sistemas Contábeis</b>, localize <b>Domínio</b> ou <b>DomínioWeb</b> e habilite <b>Integração XML</b>.</li>\n<li>Gere a chave de integração no Onvio (consulte a <a href=\"https://suporte.dominioatendimento.com/central/faces/solucao.html?codigo=8536\" target=\"_blank\" rel=\"noopener\">documentação da Domínio</a>).</li>\n<li>Em <b>Cadastro › Empresas</b>, selecione a empresa e, na aba <b>Integrações</b>, adicione a chave gerada.</li>\n</ol>\n<div class=\"bad\">⚠️ Após configurada, a integração envia as notas automaticamente no download, mas ainda é preciso uma ação da contabilidade para importá-las na Domínio — consulte o <a href=\"https://suporte.dominioatendimento.com/central/faces/solucao.html?codigo=6901\" target=\"_blank\" rel=\"noopener\">passo a passo de importação</a>.</div>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/344945-integracao.gif\" alt=\"Integração com Domínio\">\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "NFS-e — Cidades Homologadas", "h": "<h2>📌 Visão geral</h2>\n<p>Este manual apresenta a lista oficial das <b>cidades homologadas no módulo NFS-e</b> do Automation, em ordem alfabética. Assim você verifica rapidamente se sua cidade já está disponível para integração e automação das NFS-e.</p>\n<h2>🗂️ Como usar a tabela</h2>\n<ol>\n<li><b>Verifique a cidade</b> na coluna <b>Cidade</b>.</li>\n<li><b>Confirme o UF</b> (estado) correspondente.</li>\n<li><b>Tipo de integração</b>: verifique se o acesso é via <b>API</b> (integração automática — apenas para quem usa Domínio Sistemas) ou via <b>XML</b> (importação pelas integrações do seu sistema contábil).</li>\n</ol>\n<h2>📌 Tabela de cidades homologadas</h2>\n<p>A relação, em ordem alfabética, é atualizada dinamicamente pela equipe da Pilar Sistemas:</p>\n<p><a href=\"https://docs.google.com/spreadsheets/d/17OcjveEx6w7Fy4-z-zgWlHgmsWMbiqLDz8sqJn5MnjY/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\"><b>Abrir a tabela de cidades homologadas</b></a></p>\n<h2>🔄 Atualizações</h2>\n<p>A lista é dinâmica e pode ser atualizada periodicamente. Para cidades ainda não homologadas, entre em contato com o suporte para solicitar a integração.</p>\n<div class=\"ok\">✅ <b>Dica:</b> acompanhe o <b>Boletim de liberação</b> — as novas cidades homologadas são divulgadas primeiro por lá.</div>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "NFS-e — Portal Nacional (FAQ)", "h": "<h2>📢 Sobre este FAQ</h2>\n<p>Com o <b>Portal Nacional de Emissão de Notas Fiscais</b>, surgiram dúvidas comuns sobre adesão dos municípios, forma de acesso, busca de notas e configurações no Automation. Este FAQ reúne os principais pontos de forma simples, objetiva e atualizada.</p>\n<h2>Quais municípios emitem notas pelo Portal Nacional?</h2>\n<p>Praticamente todos — agora são obrigados a enviar as notas pelo Portal Nacional, com exceção do município de <b>São Paulo</b>.</p>\n<h2>O Automation busca notas dos dois portais ao mesmo tempo?</h2>\n<p>Atualmente, o Automation busca as <b>notas de serviço prestadas e tomadas</b> (PDF e XML) apenas pelo <b>Portal Nacional</b>. Guias, protocolos, resumos e outros documentos continuam sendo buscados pelo site da prefeitura (rotina NFS-e).</p>\n<h2>Preciso configurar algo se meu município usa emissor próprio?</h2>\n<p>Sim — é necessário adicionar a rotina <b>Nota Nacional</b> na empresa.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/316136-Screenshot_10.png\" alt=\"Rotina Nota Nacional\">\n<h2>Como funciona o acesso ao Portal Nacional?</h2>\n<p>O acesso é por <b>empresa</b>, via <b>certificado digital A1</b> ou <b>login e senha</b>.</p>\n<div class=\"bad\">⚠️ Ainda <b>não há acesso via procuração</b> — não é possível acessar com credencial de contador, conforme as regras vigentes do Governo.</div>\n<h2>Meu município migrou para o Portal Nacional. O que fazer?</h2>\n<p>Cadastre no Automation o <b>certificado A1</b> ou <b>login/senha</b> do cliente, seguindo o item “Configuração de Credenciais – Nota Nacional” do artigo <b>NFS-e</b>.</p>\n<h2>Minha empresa não fez a busca de notas. Como proceder?</h2>\n<p>Se o sistema não baixar os PDFs e XMLs na rotina, verifique como está a rotina <b>Nota Nacional</b> em <b>Cadastro › Empresas › Senhas e Acessos</b>. A configuração deve ficar assim:</p>\n<p><b>Por usuário e senha:</b></p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/316154-2026-04-13%2017-17-00.gif\" alt=\"Configuração por usuário e senha\">\n<p><b>Por certificado:</b></p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/316161-2026-04-13%2017-18-34.gif\" alt=\"Configuração por certificado\">\n<h2>Download em lote — como baixar todos os documentos?</h2>\n<p>O download de todos os arquivos buscados é feito na tela do menu Fiscal, no botão <b>Em Lote</b>.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/341957-bot%C3%A3o.png\" alt=\"Botão Em Lote\">\n<p>Nesse menu você define quais arquivos baixar e como organizá-los, podendo separar por pastas:</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/341968-Screenshot_2.png\" alt=\"Configuração do download em lote\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/342102-Screenshot_4.png\" alt=\"Seleção de arquivos\">\n<p>Após configurar e clicar em <b>Realizar Download</b>, o Automation inicia o processo e disponibiliza os arquivos no botão superior:</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/342098-Screenshot_5.png\" alt=\"Download disponível\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/342099-Screenshot_6.png\" alt=\"Arquivos prontos\">\n<div class=\"bad\">⚠️ A organização depende da configuração: é possível separar empresas por pastas e criar subpastas usando o símbolo \\ entre os nomes. Tudo é organizado no arquivo ZIP baixado pelo Automation.</div>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/342000-Screenshot_3.png\" alt=\"Organização por pastas\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/342094-Screenshot_7.png\" alt=\"Arquivo ZIP organizado\">\n<div class=\"ok\">✅ O Portal Nacional já é realidade e o Automation está preparado para atender essa demanda.</div>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}]], "auditor": ["🧾 Fiscal › Auditor Fiscal", [{"t": "Auditor Fiscal", "h": "<h2>📌 Visão geral</h2>\n<p>O módulo <b>Auditor Fiscal</b> do Automation disponibiliza as planilhas de NF-e, NFC-e e CT-e do <b>SAT-SC</b>.</p>\n<h2>📊 Dashboard Auditor Fiscal</h2>\n<p>Acesse por <b>Dashboards › Auditor Fiscal</b> para a visão geral da execução e baixa das planilhas do SAT. Informações disponíveis:</p>\n<ul>\n<li><b>Empresas monitoradas</b> — empresas de SC definidas para baixar na tela do Auditor Fiscal.</li>\n<li><b>Empresas não monitoradas</b> — empresas de SC com inscrição estadual cadastrada, mas não definidas para baixar.</li>\n<li><b>Total de arquivos baixados e tempo poupado</b>.</li>\n<li><b>Gráfico por status de execução</b>.</li>\n</ul>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/338499-1780078344304.png\" alt=\"Dashboard Auditor Fiscal\">\n<h2>🖥️ Tela Auditor Fiscal</h2>\n<p>Acesse por <b>Fiscal › Auditor Fiscal</b>. Busca por Razão Social ou CNPJ/CPF, Status, Competência inicial e final, além dos botões <b>Configuração</b> e <b>Baixa em Lote</b>.</p>\n<p>A lista exibe: Status de execução, Competência, Status por processo (Entradas e Saídas), Última consulta e Ações (download).</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/338501-Captura%20de%20tela%202026-05-29%20151620.png\" alt=\"Tela Auditor Fiscal\">\n<h2>📊 Detalhamento dos status</h2>\n<table>\n<thead><tr><th>Status</th><th>Descrição</th><th>O que fazer?</th></tr></thead>\n<tbody>\n<tr><td>Sucesso</td><td>Todas as planilhas disponíveis foram baixadas.</td><td>Nenhuma ação necessária.</td></tr>\n<tr><td>Em execução</td><td>A empresa está sendo processada naquele momento.</td><td>Aguardar a conclusão.</td></tr>\n<tr><td>Aguardando execução</td><td>Nenhuma solicitação de planilha foi feita ainda.</td><td>Aguardar a execução.</td></tr>\n<tr><td>Reagendado</td><td>Não conseguiu consultar uma das planilhas e tentará novamente.</td><td>Monitorar; se persistir, verifique as configurações.</td></tr>\n<tr><td>Solicitado</td><td>Consulta feita; a planilha aguarda download.</td><td>Aguardar o download.</td></tr>\n<tr><td>Baixando planilha</td><td>A planilha está sendo baixada.</td><td>Aguardar a conclusão.</td></tr>\n<tr><td>Erro</td><td>Ocorreu uma inconsistência não mapeada.</td><td>Contate o suporte informando a empresa e a competência.</td></tr>\n<tr><td>Reagendado baixa</td><td>Não conseguiu baixar a planilha.</td><td>Monitorar; se persistir, contate o suporte.</td></tr>\n<tr><td>Configuração</td><td>Há configuração pendente pela contabilidade.</td><td>Verifique login e senha do SAT e as configurações.</td></tr>\n</tbody>\n</table>\n<p><b>Colunas Entradas e Saídas</b>: 🟢 verde = planilha baixada · 🟡 amarela = solicitada, aguardando download · 🔴 vermelha = inconsistência · ⚫ cinza = sem planilha na competência.</p>\n<h2>🛠️ Configurações necessárias</h2>\n<p>Para baixar as planilhas do SAT-SC são precisas duas configurações.</p>\n<p><b>1. Login e senha do SAT-SC</b> — em <b>Cadastro › Contador</b>, aba Dados preencha e vincule as empresas com procuração; na aba Senhas de Acesso, esfera <b>Estadual</b>, rotina <b>Auditor Fiscal</b>, estado <b>SC</b>, informe login e senha do SAT. Clique no check e em Salvar.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/338616-2026-05-29%2016-06-43.gif\" alt=\"Login e senha do SAT-SC\">\n<p><b>2. Configuração de empresas na tela Auditor Fiscal</b> — como as credenciais do contador podem ser compartilhadas com outras ferramentas (como NFS-e), há uma definição adicional: em <b>Fiscal › Auditor Fiscal › Configurações</b>, selecione as empresas a buscar no SAT-SC.</p>\n<div class=\"bad\">⚠️ Selecione apenas as empresas que possuem procuração no SAT-SC.</div>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/338676-2026-05-29%2016-20-50.gif\" alt=\"Configuração de empresas no Auditor Fiscal\">\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}]], "leao": ["🧾 Fiscal › Leão RFB", [{"t": "Leão RFB", "h": "<h2>📌 Visão geral</h2>\n<p>O <b>Leão RFB</b> do Automation permite o acompanhamento automático de pendências junto à Receita Federal, facilitando a gestão de débitos e notificações. Ideal para escritórios que querem monitorar impostos em aberto e dívida ativa de forma centralizada.</p>\n<h2>⚙️ Funcionalidades</h2>\n<ul>\n<li><b>Monitoramento das empresas</b> — consulta automática da situação fiscal com base no CNPJ, status de certificados e pendências ativas.</li>\n<li><b>Painel de status</b> — classificação visual das empresas por status de consulta, pendências e envio/visualização de notificações.</li>\n<li><b>Agendamento de rotinas</b> — buscas mensais de impostos em aberto e dívida ativa, com e sem valores.</li>\n<li><b>Download em lote</b> — baixa massiva de documentos pelo botão <b>Em Lote</b>.</li>\n</ul>\n<h2>1️⃣ Filtros de consulta</h2>\n<p>Use os filtros superiores para buscar empresas por razão social ou CNPJ, status (Sucesso, Reagendado, Sem Certificado etc.) e dívida ativa.</p>\n<h2>2️⃣ Ações por empresa</h2>\n<p>No fim de cada linha, estão disponíveis: visualizar detalhes da pendência, analisar notificações e baixar documentos.</p>\n<div class=\"ok\">ℹ️ O botão de download não reprocessa — ele baixa os documentos já disponíveis.</div>\n<h2>3️⃣ Agendamentos</h2>\n<p>Clique em <b>⚙️ Agendamento</b> para configurar tipo da rotina (impostos em aberto e dívida ativa, com ou sem valores), periodicidade (mensal), dia de execução e empresas vinculadas.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/261900-1746892548378.png\" alt=\"Agendamento do Leão RFB\">\n<h2>4️⃣ Agendamentos personalizados</h2>\n<p>É possível personalizar as empresas monitoradas fora do agendamento padrão, selecionando-as manualmente na tela de configuração da rotina.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/261910-1746911942085.png\" alt=\"Escolha de empresas monitoradas\">\n<h2>💡 Dicas úteis</h2>\n<ul>\n<li>Certificado válido é essencial — fique atento ao status “Sem Certificado”.</li>\n<li>Use o <b>Agendamento</b> para que as buscas sejam automáticas.</li>\n<li>O botão <b>Em Lote</b> baixa os documentos de todas as empresas filtradas com um clique.</li>\n<li>As notificações aparecem como “Não visualizado” ou “Visualizado”.</li>\n<li>As credenciais (usuário/senha) podem ser configuradas nas empresas ou via procuração do contador.</li>\n</ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}]], "conf": ["⚙️ Configurações", [{"t": "Perfil da Empresa", "h": "<h2>📌 Visão geral</h2>\n<p>O <b>Perfil da Empresa</b> é onde você cadastra ou edita as informações básicas da sua organização no sistema. Esse cadastro é essencial para personalizar a plataforma e manter os dados sempre atualizados.</p>\n<h2>🧾 Campos disponíveis</h2>\n<ul>\n<li><b>Razão Social</b> — nome completo da empresa.</li>\n<li><b>CPF/CNPJ</b> — documento da empresa (pessoa física ou jurídica).</li>\n<li><b>E-mail</b> — e-mail de contato oficial da empresa.</li>\n<li><b>Carregar Logo</b> — adiciona a logo da empresa (imagem do seu computador).</li>\n<li><b>Salvar</b> — grava todas as informações preenchidas.</li>\n</ul>\n<h2>▶️ Passo a passo</h2>\n<ol>\n<li>Acesse o menu <b>Configurações › Perfil da Empresa</b>.</li>\n<li>Preencha os campos obrigatórios: <b>Razão Social</b>, <b>CPF/CNPJ</b> e <b>E-mail</b>.</li>\n<li>Clique em <b>Carregar Logo</b> e selecione a imagem desejada.</li>\n<li>Clique em <b>Salvar</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270202-1749820570675.png\" alt=\"Tela de Perfil da Empresa\">\n<h2>💡 Dicas úteis</h2>\n<ul>\n<li>Use o e-mail corporativo principal da empresa para evitar problemas de comunicação.</li>\n<li>Envie a logo em boa resolução, para uma boa exibição em relatórios e telas do sistema.</li>\n<li>Sempre clique em <b>Salvar</b> após qualquer alteração.</li>\n</ul>\n<h2>💬 Suporte</h2>\n<p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Sistemas Contábeis", "h": "<h2>📌 Visão geral</h2><p>Este módulo permite <b>cadastrar e gerenciar os sistemas contábeis (ERPs)</b> utilizados pelos clientes. É possível associar empresas a diferentes sistemas e definir um <b>sistema padrão</b>, que será assumido automaticamente nos novos cadastros.</p><div class='ok'>✅ <b>Destaque:</b> o usuário pode utilizar mais de um ERP no Automation, com flexibilidade para diferentes realidades contábeis.</div><h2>📂 Tela principal — Listagem de sistemas</h2><p>Na tela principal você encontra a lista de sistemas contábeis cadastrados.</p><img src='https://tomticket-galeria.s3.amazonaws.com/42292/286022-1759408014671.png' alt='Listagem de sistemas contábeis'><p><b>Funcionalidades:</b></p><ul><li><b>Busca por nome</b> — localize rapidamente o sistema cadastrado.</li><li><b>Botão ➕ Novo</b> — adicione um novo sistema.</li></ul><p><b>Colunas principais:</b></p><ul><li><b>Sistema contábil</b> — nome do ERP (ex.: Domínio).</li><li><b>Empresas vinculadas</b> — quantidade de empresas associadas.</li></ul><p><b>Ações disponíveis:</b></p><ul><li>🏢 Visualizar empresas vinculadas</li><li>✏️ Editar sistema</li><li>🗑️ Remover sistema</li></ul><h2>🧩 Cadastro e edição de sistemas</h2><p>Ao criar ou editar um ERP, é possível:</p><ul><li>Selecionar ou digitar o <b>nome do sistema</b>.</li><li>Marcar a opção ✅ <b>Sistema padrão</b> — este será o ERP assumido para novas empresas.</li></ul><img src='https://tomticket-galeria.s3.amazonaws.com/42292/286024-1759408070941.png' alt='Cadastro e edição de sistema'><h2>🔗 Vincular empresas ao sistema</h2><p>Você pode associar empresas específicas a um ERP.</p><ul><li><b>Campo de busca</b> — localize empresas pelo nome.</li><li><b>Divisão visual:</b> 🟩 empresas vinculadas (esquerda) · 🟥 empresas não vinculadas (direita).</li></ul><p><b>Ações em massa:</b> ➕ Vincular todas · ❌ Desvincular todas. Finalize com <b>Salvar</b> ou <b>Cancelar</b>.</p><h2>💡 Dicas e boas práticas</h2><ul><li>🧠 Use nomes padronizados e fáceis de identificar (ex.: Domínio, Questor, Alterdata, Contmatic).</li><li>🔄 Mantenha sempre ao menos um sistema como padrão para facilitar os cadastros.</li><li>💼 Administre empresas com diferentes ERPs no mesmo ambiente, sem perder eficiência.</li></ul><h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href='https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0' target='_blank' rel='noopener'>Atendimento Pilar Sistemas</a>.</p>"}]], "sis-alterdata": ["🗃️ Alterdata", [{"t": "Exportação de dados", "h": "<h2>👀 Visão geral</h2>\n<p>Este manual orienta a exportação de <b>Relação de Empresas</b>, <b>Plano de Contas</b> e <b>Histórico Contábil</b> no sistema <b>Alterdata (módulos Contábil e WPHD)</b> para uso no Automation.</p>\n<h2>🏢 Exportação da relação de empresas</h2>\n<ol>\n<li>Acesse o módulo <b>WPHD</b>.</li>\n<li>Vá em <b>Cadastro › Empresas</b>.</li>\n<li>Clique em <b>Visualizar Impressão</b>.</li>\n<li>Na configuração: <b>Tipo de Relatório</b> = Relatório Simples; <b>Ordem</b> = Código; <b>Status</b> = Ativas. Clique em <b>Avançar</b>.</li>\n<li>Marque <b>Selecionar Ativas</b> e clique em <b>Concluir</b>.</li>\n<li>Clique em <b>Salvar Relatório</b> e escolha local, nome e <b>Tipo de Arquivo = .CSV</b>. Clique em <b>Salvar</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270693-1750166888528.png\" alt=\"Relação de empresas Alterdata\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270695-1750166932193.png\" alt=\"Configuração do relatório\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270696-1750166942727.png\" alt=\"Salvar em CSV\">\n<h2>📋 Exportação do plano de contas</h2>\n<div class=\"bad\">⚠️ Se você já importou o modelo de plano de contas da Pilar Sistemas anteriormente, pode pular esta etapa. Consulte o artigo <b>Importação — Plano de Contas (Pilar Sistemas)</b>.</div>\n<ol>\n<li>No <b>WPHD</b>, acesse <b>Cadastro › Plano de Contas</b>, selecione o plano desejado e clique em <b>Visualizar Impressão</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270973-1750253802161.png\" alt=\"Plano de contas Alterdata\">\n<ol start=\"2\">\n<li>Na configuração: <b>Plano de Contas</b> = Completo; <b>Ordem</b> = Código ou Nível; <b>Tipo</b> = Geral; <b>Imprimir Sub-Contas</b> = Sim; <b>Tipo de Relatório</b> = Personalizado; selecione o RTM <b>RelatorioPlanoContasCompletoPilarSistemas.rtm</b>. Clique em <b>Visualizar</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270974-1750253888248.png\" alt=\"Configuração da impressão do plano\">\n<ol start=\"3\">\n<li>Clique em <b>Imprimir</b>, selecione <b>Microsoft Print to PDF</b> (ou outro gerador de PDF) e salve o arquivo.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270975-1750253937621.png\" alt=\"Exportar plano em PDF\">\n<div class=\"ok\">💡 Confirme sempre que está usando o RTM correto. Se não tiver a opção “Microsoft Print to PDF”, instale um gerador gratuito como PDFCreator ou doPDF.</div>\n<h2>🧾 Exportação do histórico contábil</h2>\n<ol>\n<li>Acesse o módulo <b>Contábil</b>.</li>\n<li>Vá em <b>Cadastros › Histórico Padrão</b> e clique em <b>Visualizar Impressão</b>.</li>\n<li><b>Ordenação</b> = Cód. de Chamada. Clique em <b>OK</b>.</li>\n<li>Clique em <b>Salvar Relatório</b>, escolha local, nome e <b>Tipo = .CSV</b>. Clique em <b>Salvar</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270699-1750167009735.png\" alt=\"Histórico padrão Alterdata\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270700-1750167017925.png\" alt=\"Salvar histórico em CSV\">\n<div class=\"ok\">💡 Salve os arquivos em pastas organizadas por empresa ou data. O formato .CSV facilita a importação para outros sistemas.</div>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Importação — Plano de Contas (.RTM)", "h": "<h2>👀 Visão geral</h2>\n<p>Este manual orienta como importar o relatório personalizado <b>.RTM</b> no módulo de <b>Plano de Contas</b> do <b>Alterdata WPHD</b> — usado para exportar o plano de contas no formato que o Automation lê.</p>\n<h2>1️⃣ Acessando o plano de contas</h2>\n<p>No menu superior, clique em <b>Cadastro</b> e depois em <b>Plano de Contas</b>.</p>\n<h2>2️⃣ Selecionando o plano de contas</h2>\n<p>Localize o plano desejado na lista, clique sobre ele para selecionar e clique em <b>Visualizar</b> na barra de ferramentas.</p>\n<h2>3️⃣ Configurando o tipo de relatório</h2>\n<p>Na janela <b>Parâmetros de Impressão</b>, em <b>Tipo de Relatório</b>, marque <b>Personalizado</b> e clique no botão de <b>editar</b> (ícone de pasta com lupa) ao lado do campo de relatório.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270950-1750250747940.png\" alt=\"Configurando tipo de relatório\">\n<h2>4️⃣ Importando o relatório .RTM</h2>\n<p>Na tela de cadastro de relatórios, clique em <b>Importar</b>, depois no ícone de <b>buscar arquivo</b>, localize e selecione o arquivo <b>.RTM</b> (<a href=\"https://pilarsistemas.bitrix24.com.br/~VIAbE\" target=\"_blank\" rel=\"noopener\">baixar o .RTM</a>), clique em <b /b> = Classificação; <b>Folha</b> = 1; <b>Grau Máximo</b> conforme o plano; <b>Descrição da paginação</b> = Folha; <b>Data Base</b> = data atual; <b>Imprimir Plano</b> = Total; marque apenas <b>Não imprimir o nome do licenciado no rodapé</b>.</li>\n<li>Clique em <b>OK</b> para gerar e depois em <b>Salvar como PDF</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/263983-1748267551353.png\" alt=\"Plano de contas Domínio 1\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/277551-1754058495480.png\" alt=\"Plano de contas Domínio 2\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/271703-Screenshot_589.png\" alt=\"Plano de contas Domínio 3\">\n<h2>3️⃣ Exportação do histórico contábil</h2>\n<ol>\n<li>No módulo contábil, acesse <b>Relatório › Cadastrais › Histórico</b>.</li>\n<li>Configure: <b>Ordem</b> = Código; sem opções marcadas.</li>\n<li>Clique em <b>OK</b> para gerar e depois em <b>Salvar como PDF</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/263985-1748267730917.png\" alt=\"Histórico Domínio 1\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/263986-1748267738940.png\" alt=\"Histórico Domínio 2\">\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Importação de lançamentos", "h": "<h2>📌 Visão geral</h2>\n<p>Como importar, no <b>Domínio Contábil</b>, os lançamentos contábeis gerados pelo Automation. O processo tem duas etapas: configurar o layout e importar o arquivo.</p>\n<h2>1️⃣ Configuração do layout</h2>\n<ol>\n<li>No módulo <b>Contabilidade</b> do Domínio, acesse <b>Utilitários › Importação › Importador › Conjuntos de Dados</b>.</li>\n<li>Clique em <b>Importar</b> e selecione o arquivo <b>Lançamentos Contábeis - Automation.xml</b> (<a href=\"https://pilarsistemas.bitrix24.com.br/~ObQxz\" target=\"_blank\" rel=\"noopener\">baixar o arquivo</a>).</li>\n<li>Se perguntar se deseja continuar, clique em <b>Sim</b>.</li>\n</ol>\n<h2>2️⃣ Importação do arquivo (TXT)</h2>\n<ol>\n<li>Acesse novamente <b>Utilitários › Importação › Importador › Importar</b>.</li>\n<li>Selecione o <b>Tipo</b> = TXT, escolha o arquivo exportado pela Pilar e, em <b>Conjuntos de Dados</b>, selecione <b>Lançamentos Contábeis (Automation)</b>.</li>\n<li>Clique em <b>Importar</b>; confira os lançamentos identificados e clique em <b>Gravar</b> para finalizar.</li>\n</ol>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Duplicatas", "h": "<h2>📌 Visão geral</h2>\n<p>A <b>Leitura e Exportação de Duplicatas – Domínio</b> permite vincular e baixar duplicatas a partir dos relatórios do ERP Domínio, integrando com o extrato bancário do Automation: consolidar relatórios, fazer vínculos, controlar juros/multa/descontos e exportar no formato do Domínio para baixa automática.</p>\n<h2>📤 Exportação dos relatórios (Domínio)</h2>\n<p>No <b>Domínio Escrita Fiscal</b>, gere e salve em <b>PDF</b>:</p>\n<ul>\n<li><b>Contas a Pagar/Receber</b> — mais fácil de ler e importar.</li>\n<li><b>Lançamentos</b> — usado para contrapartidas.</li>\n<li><b>Acompanhamento de Entrada/Saída</b> — usado para CNPJ, espécie, série e acumulador.</li>\n</ul>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/278855-1754919616211.png\" alt=\"Contas a pagar/receber\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/278857-1754919745793.png\" alt=\"Acompanhamento entrada/saída\">\n<h2>📥 Importação no Automation</h2>\n<ol>\n<li>Na tela de <b>Extrato Bancário</b>, anexe os relatórios como <b>documentos auxiliares</b>.</li>\n<li>Clique na flecha à esquerda do lançamento para abrir a lista de duplicatas lidas.</li>\n<li>Edite <b>Juros/Multa, Desconto e Valor pago</b> quando necessário. Para <b>baixa parcial</b>, informe o valor proporcional (controle no campo “Em aberto”).</li>\n<li>O botão <b>Aplicar sugestão</b> preenche juros e descontos automaticamente.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/278886-1754924893535.png\" alt=\"Anexar documentos auxiliares\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/278895-1754925358594.png\" alt=\"Lista de duplicatas\">\n<h2>⚙️ Multa, juros e desconto (sem complemento)</h2>\n<p>É possível exportar multa, juros e desconto <b>sem complemento</b>, usando apenas a conta histórico — por empresa ou global.</p>\n<p><b>Por empresa:</b> ao selecionar uma empresa que use Domínio ou DomínioWeb, a opção <b>Duplicatas</b> é habilitada na configuração por empresa; ali você define se exporta com ou sem complemento.</p>\n<div class=\"bad\">⚠️ Com “Sem Complemento” ativado, é obrigatório definir as contas históricos de Juros, Multa e Desconto em Pagamento e em Recebimento.</div>\n<p><b>Global (todas as empresas):</b> em <b>Configuração › Sistema Contábil</b>, no lápis do Domínio/DomínioWeb, desmarque <b>Exportar duplicatas com complemento em juros, multa e desconto</b>.</p>\n<div class=\"bad\">⚠️ Ativada globalmente, a opção bloqueia a alteração individual por empresa. As contas históricos precisam estar corretas para evitar erros na importação.</div>\n<h2>🔗 Regras de vínculo automático de duplicatas</h2>\n<p>O sistema aplica estratégias automáticas de vinculação. Nesses casos, os lançamentos já vêm com a origem marcada como <b>Duplicata</b> e vinculados automaticamente após a leitura.</p>\n<p><b>1ª estratégia — por nº de documento (prioritária):</b> vincula quando o lançamento e a duplicata têm o mesmo número de documento. Atendida a condição, todas as duplicatas são vinculadas; se o valor em aberto for maior que o do lançamento, aplica <b>baixa parcial</b> gerando juros/multa (do mais antigo para o mais recente).</p>\n<div class=\"bad\">⚠️ As demais regras só são aplicadas se a coluna “Documento” estiver vazia.</div>\n<p><b>Alternativa:</b> se o nº de documento estiver na coluna <b>Complemento</b> e for igual ao da duplicata, o vínculo é feito seguindo as mesmas regras.</p>\n<p><b>2ª estratégia — por data e valor:</b> mesmo valor do lançamento e vencimento dentro de um intervalo de até 2 dias antes ou depois da data do extrato, sem vínculos anteriores.</p>\n<p><b>3ª estratégia — por valor e nome do fornecedor ou CPF/CNPJ:</b> valor exato + nome do fornecedor ou CPF/CNPJ (com ou sem máscara).</p>\n<div class=\"bad\">⚠️ O vínculo automático ocorre apenas em correspondência <b>1 para 1</b> ou <b>1 para N</b> (um lançamento do extrato para uma ou várias duplicatas). Não vincula automaticamente <b>N:1</b> (várias movimentações do extrato para uma única duplicata).</div>\n<h2>🎛️ Regras de seleção</h2>\n<ul>\n<li><b>Recebimento</b> — quando a conta do banco está debitando (saída no extrato).</li>\n<li><b>Pagamento</b> — quando a conta do banco está creditando (entrada no extrato).</li>\n<li><b>Baixa parcial</b> — dá para selecionar a mesma duplicata várias vezes até quitar o valor.</li>\n<li><b>Múltiplas duplicatas</b> — dá para vincular mais de uma ao mesmo lançamento (ex.: várias parcelas juntas).</li>\n</ul>\n<h2>📦 Exportar para o Domínio</h2>\n<p>Concluídos os vínculos, clique em <b>Exportar</b>. Dá para exportar só o extrato ou extrato + duplicatas, com ou sem contabilização:</p>\n<ul>\n<li><b>Com contabilização</b> — já vão para o ERP com a conta de fornecedor/cliente automaticamente.</li>\n<li><b>Sem contabilização</b> — gerados sem os dados de fornecedor/cliente.</li>\n</ul>\n<p>Para o Domínio, entradas e saídas saem no <b>mesmo arquivo</b>. No módulo fiscal do Domínio (mesma empresa do Automation), acesse <b>Utilitários › Importação › Importação Padrão › Leiaute Domínio Sistemas com Separador</b>, selecione o arquivo e clique em <b>Importar</b>. Consulte ttps://tomticket-galeria.s3.amazonaws.com/42292/292059-Captura%20de%20tela%202025-11-17%20174609.png\" alt=\"Exportar empresas Excel\">\n<h2>2️⃣ Exportação do plano de contas</h2>\n<ol>\n<li>No módulo <b>Contábil</b>, acesse <b>Cadastro › Plano de Contas › Relatório</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/292060-Captura%20de%20tela%202025-11-28%20114744.png\" alt=\"Relatório plano de contas\">\n<ol start=\"2\">\n<li>Selecione o modelo <b>Plano de Contas 1</b> e clique em <b>Excel</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/292061-Captura%20de%20tela%202025-11-17%20174259.png\" alt=\"Exportar plano Excel\">\n<h2>3️⃣ Exportação do histórico</h2>\n<ol>\n<li>No módulo <b>Contábil</b>, acesse <b>Cadastro › Histórico › Relatório</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/292065-Captura%20de%20tela%202025-11-17%20174327.png\" alt=\"Relatório de histórico\">\n<ol start=\"2\">\n<li>Selecione o modelo <b>Histórico Contábil</b> e clique em <b>Excel</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/292064-Captura%20de%20tela%202025-11-17%20174357.png\" alt=\"Exportar histórico Excel\">\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Importação de lançamentos", "h": "<h2>📌 Visão geral</h2>\n<p>Como importar, no <b>MakroSystem</b>, os lançamentos contábeis gerados pelo Automation, usando a importação em texto.</p>\n<h2>▶️ Importação</h2>\n<ol>\n<li>No módulo <b>Contábil</b>, acesse <b>Importação › Importação em Texto</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/292056-Captura%20de%20tela%202025-11-28%20163317.png\" alt=\"Importação em texto MakroSystem\">\n<ol start=\"2\">\n<li>Clique em <b>Selecionar</b> para anexar o arquivo de texto do Automation e clique em <b>Importar</b>.</li>\n</ol>\n<div class=\"ok\">💡 Confirme que o arquivo foi gerado corretamente pelo Automation e não foi editado manualmente. Revise os lançamentos após importar.</div>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Duplicatas", "h": "<h2>📌 Visão geral</h2>\n<p>A <b>Leitura e Exportação de Duplicatas – MakroSystem</b> permite vincular e baixar duplicatas a partir dos relatórios do ERP, integrando com o extrato bancário do Automation.</p>\n<h2>📤 Exportação dos relatórios (MakroSystem)</h2>\n<ol>\n<li>No ERP, acesse <b>Movimentações › Controle de Clientes/Fornecedores</b>.</li>\n<li>Configure o filtro: <b>Período = Todos</b> e <b>Situação = Somente a receber</b>.</li>\n<li>Clique em <b>Acessar Relatório</b> e, na tela do relatório, em <b>Exportar Relatório para Excel</b>; salve o arquivo.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/322091-Screenshot_17.png\" alt=\"Controle de clientes/fornecedores\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/322097-Screenshot_19.png\" alt=\"Filtro de duplicatas\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/322105-Screenshot_23.png\" alt=\"Exportar para Excel\">\n<h2>📥 Importação no Automation</h2>\n<ol>\n<li>Configure a empresa (<b>Recebimento</b> e <b>Pagamento</b>) no Automation.</li>\n<li>Na tela de <b>Extrato Bancário</b>, anexe os relatórios como <b>documentos auxiliares</b>.</li>\n<li>Clique na flecha à esquerda do lançamento, edite <b>Juros/Multa, Desconto e Valor pago</b> quando necessário e use <b>Aplicar sugestão</b> para preencher juros e descontos.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/326809-1778240927190.png\" alt=\"Anexar relatórios\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/326811-1778240952725.png\" alt=\"Lista de duplicatas MakroSystem\">\n<h2>🔗 Regras de vínculo automático de duplicatas</h2>\n<p>O sistema aplica estratégias automáticas de vinculação. Nesses casos, os lançamentos já vêm com a origem marcada como <b>Duplicata</b> e vinculados automaticamente após a leitura.</p>\n<p><b>1ª estratégia — por nº de documento (prioritária):</b> vincula quando o lançamento e a duplicata têm o mesmo número de documento. Atendida a condição, todas as duplicatas são vinculadas; se o valor em aberto for maior que o do lançamento, aplica <b>baixa parcial</b> gerando juros/multa (do mais antigo para o mais recente).</p>\n<div class=\"bad\">⚠️ As demais regras só são aplicadas se a coluna “Documento” estiver vazia.</div>\n<p><b>Alternativa:</b> se o nº de documento estiver na coluna <b>Complemento</b> e for igual ao da duplicata, o vínculo é feito seguindo as mesmas regras.</p>\n<p><b>2ª estratégia — por data e valor:</b> mesmo valor do lançamento e vencimento dentro de um intervalo de até 2 dias antes ou depois da data do extrato, sem vínculos anteriores.</p>\n<p><b>3ª estratégia — por valor e nome do fornecedor ou CPF/CNPJ:</b> valor exato + nome do fornecedor ou CPF/CNPJ (com ou sem máscara).</p>\n<div class=\"bad\">⚠️ O vínculo automático ocorre apenas em correspondência <b>1 para 1</b> ou <b>1 para N</b> (um lançamento do extrato para uma ou várias duplicatas). Não vincula automaticamente <b>N:1</b> (várias movimentações do extrato para uma única duplicata).</div>\n<h2>🎛️ Regras de seleção</h2>\n<ul>\n<li><b>Recebimento</b> — quando a conta do banco está debitando (saída no extrato).</li>\n<li><b>Pagamento</b> — quando a conta do banco está creditando (entrada no extrato).</li>\n<li><b>Baixa parcial</b> — dá para selecionar a mesma duplicata várias vezes até quitar o valor.</li>\n<li><b>Múltiplas duplicatas</b> — dá para vincular mais de uma ao mesmo lançamento (ex.: várias parcelas juntas).</li>\n</ul>\n<h2>📦 Exportar para o MakroSystem</h2>\n<p>Concluídos os vínculos, clique em <b>Exportar</b> (só extrato ou extrato + duplicatas com contabilização). No MakroSystem, entradas e saídas saem em <b>arquivos diferentes</b>. No módulo <b>Contábil</b>, acesse <b>Movimentações › Controle de Fornecedores/Clientes › Pagamento em Massa</b>, selecione a duplicata desejada e importe.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/326817-1778241304926.png\" alt=\"Exportar MakroSystem\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/326820-1778241405594.png\" alt=\"Pagamento em massa\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/326821-1778241437672.png\" alt=\"Selecionar duplicatas\">\n<div class=\"ok\">💡 Confira se a duplicata é de fornecedor ou cliente abrindo a planilha: <b>PGTOCLI</b> = cliente; <b>PGTOFOR</b> = fornecedor. Confirme que o arquivo veio do Automation e revise os vínculos após importar.</div>\n<h2>🎯 Observações importantes</h2>\n<ul>\n<li>Duplicatas não usam as configurações padrão de contrapartida do Automation, apenas para multa, juros e desconto.</li>\n<li>Lançamentos vinculados como duplicata não podem ter contrapartida configurada, ter campos editáveis alterados depois do vínculo, nem ser exportados na rotina contábil comum (somente no arquivo específico de duplicatas).</li>\n</ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}]], "sis-mm-mario-monteiro": ["🗃️ MM Mario Monteiro", [{"t": "Exportação de dados", "h": "<h2>👀 Visão geral</h2>\n<p>Este manual orienta a exportação do <b>Plano de Contas</b> e dos <b>Históricos Padronizados</b> no <b>MM Mario Monteiro</b>, gerando os arquivos em <b>Excel</b>.</p>\n<h2>1️⃣ Exportação do plano de contas</h2>\n<ol>\n<li>Acesse o módulo contábil e vá em <b>Relatórios › Contabilidade › Planos de Contas</b> >\n<ol>\n<li>Acesse <b>Integração › Importação › Configurar Layout › Caracter Separador</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/326608-1778180749559.png\" alt=\"Configurar layout\">\n<ol start=\"2\">\n<li>Selecione o layout e o arquivo, informe a ordem dos campos e clique em <b>Alterar Item</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/326631-1778181950371.png\" alt=\"Ordem dos campos\">\n<h2>3️⃣ Importar o arquivo</h2>\n<ol>\n<li>Acesse <b>Integração › Importação Layout › Importar Arquivo › Caracter Separador</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/326722-1778186232985.png\" alt=\"Importar arquivo NetSpeed\">\n<ol start=\"2\">\n<li>Selecione o layout e o tipo de arquivo <b>Lançamentos</b>, clique na lupa para buscar o arquivo e clique em <b>Importar</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/326724-1778186258490.png\" alt=\"Importação do arquivo\">\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}]], "sis-oneflow": ["🗃️ Oneflow", [{"t": "Exportação de dados", "h": "<h2>👀 Visão geral</h2>\n<p>Este guia orienta a exportação de <b>Empresas</b>, <b>Plano de Contas</b> e <b>Histórico</b> no <b>Oneflow</b>, para uso no Automation. O padrão é: abrir a lista, configurar as colunas e usar <b>Exportar</b>, escolhendo o formato (CSV, Excel, PDF).</p>\n<h2>1️⃣ Exportação das empresas</h2>\n<ol>\n<li>Na aba <b>Contábil</b>, clique em <b>Minhas Empresas</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/273280-1.%20Minhas%20empresaspng.png\" alt=\"Minhas empresas Oneflow\">\n<ol start=\"2\">\n<li>No menu de opções, selecione <b>Configurar exibição</b> e marque as colunas desejadas; clique em <b>Aplicar</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/273281-2.%20Configura%C3%A7%C3%A3o%20de%20colunas.png\" alt=\"Configurar colunas\">\n<ol start=\"3\">\n<li>No menu de opções, clique em <b>Exportar</b> e escolha o formato (ex.: <b>Arquivo Texto CSV</b>).</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/273283-4.%20Exportar%20dados.png\" alt=\"Exportar empresas\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/273284-5.%20Formato%20da%20exporta%C3%A7%C3%A3o.png\" alt=\"Formato da exportação\">\n<h2>2️⃣ Exportação do plano de contas</h2>\n<ol>\n<li>Acesse o módulo <b>Planos de Contas</b> e selecione o plano desejado.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/273285-1.%20Lista%20de%20plano%20de%20contas.png\" alt=\"Lista de planos de contas\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/273286-2.%20Plano%20de%20contas.png\" alt=\"Plano de contas\">\n<ol start=\"2\">\n<li>(Opcional) clique com o botão direito na tabela e use <b>Configurar Exibição</b> para ajustar colunas.</li>\n<li>Clique com o botão direito e selecione <b>Exportar</b>, escolhendo o formato (CSV, Excel, PDF).</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/273288-4.%20Exportar%20Relat%C3%B3rio.png\" alt=\"Exportar plano\">\n<h2>3️⃣ Exportação do histórico</h2>\n<ol>\n<li>Acesse o menu <b>Planos de Históricos</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/273290-1.%20Lista%20de%20plano%20de%20hist%C3%B3rico.png\" alt=\"Lista de planos de histórico\">\n<ol start=\"2\">\n<li>(Opcional) clique com o botão direito e use <b>Configurar exibição</b> para ajustar colunas.</li>\n<li>Clique com o botão direito, selecione <b>Exportar</b> e escolha o formato (PDF, HTML, Excel ou CSV).</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/273293-4.%20Exportar.png\" alt=\"Exportar histórico\">\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Importação de lançamentos", "h": "<h2>📌 Visão geral</h2>\n<p>Como abrir a empresa contábil e importar, no <b>OneFlow</b>, os lançamentos gerados pelo Automation.</p>\n<h2>1️⃣ Abrir a empresa contábil</h2>\n<ol>\n<li>Acesse o módulo <b>Contábil</b>, localize a empresa e clique em <b>Abrir Contábil</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/273295-1.%20Abrir%20empresa.png\" alt=\"Abrir empresa contábil\">\n<h2>2️⃣ Acessar a importação</h2>\n<ol>\n<li>No menu <b>Contábil › Lançamentos</b>, clique em <b>Importar lançamentos</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/273296-1.%20Importa%C3%A7%C3%A3o%20de%20lan%C3%A7amentos.png\" alt=\"Importar lançamentos OneFlow\">\n<h2>3️⃣ Selecionar o tipo de planilha</h2>\n<ol>\n<li>Clique em <b>Planilha de Lançamentos</b> e escolha entre <b>Partidas múltiplas</b> ou <b>Partidas simples</b>.</li>\n</ol>\n<div class=\"ok\">🔍 Normalmente usa-se <b>Partidas múltiplas</b> para lançamentos com mais de uma conta envolvida.</div>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/273297-3.%20Planilha%20de%20lan%C3%A7amento.png\" alt=\"Tipo de planilha\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/273298-3.1.%20Planilha%20de%20lan%C3%A7amento.png\" alt=\"Partidas múltiplas/simples\">\n<h2>4️⃣ Enviar a planilha</h2>\n<ol>\n<li>Arraste ou selecione a planilha salva no computador.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/273299-3.2.%20Planilha%20de%20lan%C3%A7amentos.png\" alt=\"Upload da planilha\">\n<div class=\"ok\">💡 Use sempre o modelo de planilha do sistema, confira as colunas obrigatórias e revise os lançamentos após importar.</div>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}]], "sis-ph-software": ["🗃️ PH Software", [{"t": "Exportação de dados", "h": "<h2>👀 Visão geral</h2>\n<p>Este manual orienta a exportação de <b>Empresas</b>, <b>Plano de Contas</b> e <b>Histórico</b> no <b>PH Software</b>, para uso no Automation. Em todos os casos, clique com o <b>botão direito</b> na lista e selecione <b>Exportar para Excel</b>.</p>\n<h2>1️⃣ Exportação das empresas</h2>\n<ol>\n<li>No módulo contábil, abra a lista de empresas.</li>\n<li>Clique com o <b>botão direito</b> na lista e selecione <b>Exportar para Excel</b>.</li>\n</ol>\n<h2>2️⃣ Exportação do plano de contas</h2>\n<ol>\n<li>No módulo contábil, acesse <b>Cadastro › Planos de Contas</b>.</li>\n<li>Clique com o <b>botão direito</b> na lista de contas e selecione <b>Exportar para Excel</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/272338-1751333853324.png\" alt=\"Plano de contas PH Software\">\n<h2>3️⃣ Exportação do histórico</h2>\n<ol>\n<li>No módulo contábil, acesse <b>Cadastro › Histórico</b>.</li>\n<li>Clique com o <b>botão direito</b> e selecione <b>Exportar para Excel</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/272339-1751333901901.png\" alt=\"Histórico PH Software\">\n<div class=\"ok\">💡 Confirme que o Excel está instalado e organize os arquivos exportados em pastas com nomes claros.</div>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Importação de lançamentos", "h": "<h2>👀 Visão geral</h2>\n<p>Como importar, no <b>PH Software (SCPH)</b>, os lançamentos contábeis gerados pelo Automation.</p>\n<h2>▶️ Importação</h2>\n<ol>\n<li>No SCPH, acesse <b>Interligações › Importação</b>.</li>\n</ol>\n<img src=\"https://to ico</h2>\n<ol>\n<li>Acesse <b>Arquivos › Contabilidade › Histórico Padrão</b> e clique em <b>Exportar para</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/272352-1751336192003.png\" alt=\"Histórico Priori\">\n<ol start=\"2\">\n<li>Na mensagem de exportação para Excel, clique sempre em <b>Não</b> (para gerar o arquivo correto).</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/272353-1751336221903.png\" alt=\"Mensagem de exportação\">\n<div class=\"ok\">💡 Confirme que o Excel está instalado e organize os arquivos exportados em pastas com nomes claros.</div>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}]], "sis-questor": ["🗃️ Questor", [{"t": "Exportação de dados", "h": "<h2>👀 Visão geral</h2>\n<p>Este guia orienta a exportação de <b>Empresas</b>, <b>Plano de Contas</b> e <b>Histórico Contábil</b> no <b>Questor</b>, para uso no Automation.</p>\n<h2>1️⃣ Exportação de empresas</h2>\n<ol>\n<li>No <b>Gerenciador de Empresas</b>, acesse <b>Relatório › Cadastrais › Empresas › Empresas</b>.</li>\n<li>Em <b>Parâmetro (1)</b>, configure: <b>Modo Impressão</b> = Texto; <b>Tipo Relatório</b> = Sintético; <b>Ordenar</b> = Empresa; demais campos sem filtro.</li>\n<li>Clique em <b>Visualização (2)</b> para gerar e depois em <b>Exportar relatório para outros formatos › PDF</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264643-1748464531928.png\" alt=\"Empresas Questor 1\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264644-1748464576940.png\" alt=\"Empresas Questor 2\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264646-1748464637966.png\" alt=\"Empresas Questor 3\">\n<h2>2️⃣ Exportação do plano de contas</h2>\n<p>No Questor há dois tipos de plano — <b>padrão</b> e <b>específico por empresa</b>. Use o que a empresa utiliza.</p>\n<p><b>Plano padrão:</b> <b>Relatórios › Cadastrais › Plano de contas › Plano de Contas Padrão</b>. Em Parâmetro (1): Quebra Página por Grupo = Sim; Imprimir Somente Contas Sintéticas = Não; Imprimir Campo Entra no Balanço = Sim; selecione o plano padrão.</p>\n<p><b>Plano específico:</b> <b>Relatórios › Cadastrais › Plano de contas › Plano de Contas Específico sem Saldo</b>. Em Parâmetro (1): Quebra Página por Grupo = Sim; Imprimir Somente Contas Sintéticas = Não; Imprimir Folha Inicial = Frente; Imprimir Campo Entra no Balanço = Sim; selecione a empresa.</p>\n<p>Em ambos, clique em <b>Visualização (2)</b> e depois em <b>Exportar relatório para outros formatos › CSV</b>.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264647-1748465642804.png\" alt=\"Plano Questor 1\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264648-1748465891601.png\" alt=\"Plano Questor 2\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264650-1748465959889.png\" alt=\"Plano Questor 3\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264649-1748465921642.png\" alt=\"Plano Questor 4\">\n<h2>3️⃣ Exportação do histórico contábil</h2>\n<ol>\n<li>No módulo contábil, acesse <b>Relatório › Cadastrais › Históricos › Histórico Contábeis</b>.</li>\n<li>Em <b>Parâmetro (1)</b>: <b>Quebrar</b> = Nenhum; <b>Imprimir Folha Inicial</b> = Frente; <b>Ordenar</b> = Histórico; demais campos sem filtro.</li>\n<li>Clique em <b>Visualização (2)</b> e depois em <b>Exportar relatório para outros formatos › CSV</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264664-1748517251813.png\" alt=\"Histórico Questor 1\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264665-1748517288146.png\" alt=\"Histórico Questor 2\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264666-1748517325563.png\" alt=\"Histórico Questor 3\">\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Importação de lançamentos", "h": "<h2>📌 Visão geral</h2>\n<p>Como importar, no <b>Questor</b>, os lançamentos contábeis (arquivo CSV) gerados pelo Automation.</p>\n<h2>⚙️ Configuração do leiaute (opcional)</h2>\n<ol>\n<li>No módulo Contábil da Questor, acesse <b>Utilitários › Banco de Dados › Configurador de Leiaute de importação/exportação</b>.</li>\n<li>Clique na <b>pastinha 📂</b> e selecione o arquivo .nli (<a href=\"https://pilarsistemas.bitrix24.com.br/~C5Bxx\" target=\"_blank\" rel=\"noopener\">baixar o arquivo .nli</a>).</li>\n<li>É possível alterar as configurações, <b>Salvar como</b> um novo layout .nli e usá-lo nas importações futuras.</li>\n</ol>\n<h2>▶️ Importação</h2>\n<ol>\n<li>Acesse <b>Utilitários › Banco de Dados › Importação</b>.</li>\n<li>No campo <b>Leiaute</b>, selecione o .nli padrão de importação da Questor.</li>\n<li>No campo <b>Arquivo</b>, selecione o CSV gerado pelo Automation.</li>\n<li>Clique em <b>Executar</b> e selecione a <b>empresa e filial</b> ativas na Questor.</li>\n</ol>\n<h2>🔎 Conferência</h2>\n<ol>\n<li>Acesse <b>Movimentos › Lançamentos Contábeis</b> — o sistema exibe o último lançamento automaticamente.</li>\n<li>Se não aparecer, clique no <b>binóculo</b> para busca manual. Você pode filtrar por qualquer campo clicando sobre ele.</li>\n</ol>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}]], "sis-questorcloud": ["🗃️ QuestorCloud", [{"t": "Exportação de dados", "h": "<h2>👀 Visão geral</h2>\n<p>Este guia orienta a exportação de <b>Plano de Contas</b> e <b>Histórico Contábil</b> no <b>QuestorCloud</b>, para uso no Automation. A saída é <b>Excel</b>.</p>\n<h2>1️⃣ Exportação do plano de contas</h2>\n<ol>\n<li>No menu superior, acesse <b>Operações › Contabilidade › Plano de Contas</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/287348-Plano%20de%20contas%201.png\" alt=\"Plano de contas QuestorCloud 1\">\n<ol start=\"2\">\n<li>Clique na aba <b>Plano Específico</b> e depois em <b>Plano de Contas Específico</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/287349-Plano%20de%20contas%202.png\" alt=\"Plano específico\">\n<ol start=\"3\">\n<li>No canto superior direito da grade, clique no <b>ícone de exportação</b> e escolha <b>Exportar todos para Excel</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/287350-Plano%20de%20contas%203.png\" alt=\"Exportar plano\">\n<h2>2️⃣ Exportação do histórico contábil</h2>\n<ol>\n<li>Acesse <b>Operações › Contabilidade › Plano de Contas</b> e a aba <b>Plano Específico</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/287357-Plano%20de%20hist%C3%B3rico%202.png\" alt=\"Histórico QuestorCloud\">\n<ol start=\"2\">\n<li>No canto superior direito da grade, clique no <b>ícone de exportação</b> e escolha <b>Exportar todos para Excel</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/287358-Plano%20de%20hist%C3%B3rico%203.png\" alt=\"Exportar histórico\">\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Importação de lançamentos", "h": "<h2>📌 Visão geral</h2>\n<p>Como importar no <b>QuestorCloud</b> o arquivo <b>TXT</b> gerado pelo Automation, no leiaute do Questor.</p>\n<h2>✅ Pré-requisitos</h2>\n<ul>\n<li>Arquivo <b>.TXT</b> gerado pelo Automation no leiaute do Questor.</li>\n<li>Permissão de acesso ao módulo de <b>Importação Contábil</b> no Questor Cloud.</li>\n<li>Empresa e competência configuradas no Questor.</li>\n</ul>\n<h2>1️⃣ Acessar a importação</h2>\n<ol>\n<li>Acesse <b>Operações › Contabilidade Geral › Banco de dados › Importação</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/287427-1760447855371.png\" alt=\"Importação QuestorCloud\">\n<h2>2️⃣ Configurar a importação</h2>\n<ul>\n<li><b>Leiaute</b> — selecione o conjunto de dados compatível com o TXT do Automation (<a href=\"https://bitrix24public.com/pilarsistemas.bitrix24.com.br/docs/pub/be068f2ade97811a118a84a6bcacd202/default/?&\" target=\"_blank\" rel=\"noopener\">baixar o arquivo .nli</a>).</li>\n<li><b>Arquivo</b> — aponte para o <b>.TXT</b> gerado pelo Automation.</li>\n<li><b>Poder alterar os Dados</b> — Não.</li>\n<li><b>Executar validação final</b> — Não.</li>\n</ul>\n<div class=\"ok\">💡 Manter “Poder alterar os Dados = Não” e “Executar validação final = Não” evita alterações indevidas e acelera a carga. As validações podem ser feitas na conferência posterior.</div>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/287432-1760448065701.png\" alt=\"Configuração da tela de importação\">\n<h2>3️⃣ Importar e conferir</h2>\n<ol>\n<li>Clique em <b>Importar/Processar</b> (o nome do botão pode variar por versão) e aguarde a conclusão.</li>\n<li>Confira quantidades, datas e totais nos relatórios do Questor, comparando amostras com o arquivo do Automation.</li>\n<li>Se houver divergência, corrija na origem, gere um novo TXT e importe novamente.</li>\n</ol>\n<h2>🧩 Problemas comuns</h2>\n<ul>\n<li><b>Leiaute incompatível</b> — confira se selecionou o leiaute correto e se o TXT veio do Automation atualizado.</li>\n<li><b>Arquivo inválido ou vazio</b> — confirme se o TXT não está em branco, corrompido ou de outra empresa/competência.</li>\n<li><b>Dados fora do período</b> — verifique a competência configurada na empresa e no arquivo.</li>\n<li><b>Duplicidade</b> — não importe o mesmo arquivo duas vezes; se precisar reimportar, limpe/estorne a base do período antes.</li>\n</ul>\n<div class=\"ok\">💡 Salve o arquivo com um padrão de nome (ex.: Empresa_MesAno_ExtratoAutomation.txt) e teste em base de homologação ao mudar processos.</div>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}]], "sis-systempro": ["🗃️ SystemPro", [{"t": "Exportação de dados", "h": "<h2>📌 Visão geral</h2>\n<p>Este guia orienta a exportação de <b>Empresas</b> e <b>Plano de Contas</b> no <b>SystemPro</b>, para uso no Automation. A saída é obrigatoriamente <b>XLSX</b>.</p>\n<h2>1️⃣ Exportação de empresas</h2>\n<ol>\n<li>Acesse <b>Cadastros › Empresas</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/301429-Cadastros%20-%20Empresas.png\" alt=\"Cadastros Empresas SystemPro\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/301430-tela%20de%20empresas.png\" alt=\"Tela de empresas\">\n<ol start=\"2\">\n<li>Clique em <b>Imprime</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/301431-IMPRIMIR%20empresa.png\" alt=\"Imprimir empresa\">\n<ol start=\"3\">\n<li>Escolha o caminho, o nome, o formato <b>XLSX</b> e clique em <b>Arquivo</b> para salvar.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/301432-escolhe%20caminho%2C%20nome%20do%20arquivo%2C%20formato%20XLSX%20e%20clica%20em%20ARQUIVO.png\" alt=\"Salvar XLSX empresas\">\n<h2>2️⃣ Exportação do plano de contas</h2>\n<ol>\n<li>Acesse <b>Cadastros › Contas Contábeis</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/301433-cadastro%20contas%20contabeis1.png\" alt=\"Contas contábeis SystemPro\">\n<ol start=\"2\">\n<li>Clique em <b>Imprime › Imprimir</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/301434-plano%20contas%20clica%20em%20Imprimir.png\" alt= Configuração de linhas\">\n<h2>▶️ Importação</h2>\n<ol>\n<li>Acesse novamente <b>Integrações › Importação de lançamentos a partir de planilhas eletrônicas da empresa</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/329065-Screenshot_20.png\" alt=\"Menu de importação\">\n<ol start=\"2\">\n<li>Selecione o layout já cadastrado no Visual.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/329066-Screenshot_21.png\" alt=\"Selecionar layout\">\n<ol start=\"3\">\n<li>Selecione o arquivo a importar e clique em <b>OK</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/329068-Screenshot_22.png\" alt=\"Selecionar arquivo\">\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Participantes", "h": "<h2>👀 Visão geral</h2>\n<p>Como exportar, no <b>SCI Visual</b>, os dados dos <b>participantes</b> (fornecedores) para uso no Automation.</p>\n<h2>▶️ Passo a passo</h2>\n<ol>\n<li>No módulo <b>Fiscal/Suprema</b>, acesse <b>Cadastros › Fornecedores</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/356961-Screenshot_7.png\" alt=\"Cadastro de fornecedores Visual\">\n<ol start=\"2\">\n<li>Clique na <b>lupa 🔎</b> para consultar.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/356962-Screenshot_8.png\" alt=\"Consulta de fornecedores\">\n<ol start=\"3\">\n<li>Com a consulta aberta, clique no ícone da <b>impressora 🖨️</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/356963-Screenshot_9.png\" alt=\"Impressora\">\n<ol start=\"4\">\n<li>Selecione as colunas <b>Código, Nome e CPF/CNPJ</b> e clique em <b>XLS</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/356964-Screenshot_10.png\" alt=\"Exportar XLS\">\n<h2>💬 Suporte</h2><p>Em a</b>.</li>\n<li>Selecione os campos <b>Código, Apelido, Nome</b>, nessa ordem.</li>\n<li>Clique em <b>Exportar para Excel</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264685-1748523416160.png\" alt=\"Histórico Único 1\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264686-1748523425264.png\" alt=\"Histórico Único 2\">\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Importação de lançamentos", "h": "<h2>📌 Visão geral</h2>\n<p>Como importar, no <b>SCI Único</b>, os lançamentos contábeis a partir dos arquivos TXT gerados pelo Automation.</p>\n<h2>⚙️ Configuração do layout</h2>\n<ol>\n<li>Acesse <b>Integrações › Gerador de importações › Lançamentos Contábeis</b>.</li>\n<li>Se necessário, baixe o layout padrão (<a href=\"https://pilarsistemas.bitrix24.com.br/~YvaB1\" target=\"_blank\" rel=\"noopener\">baixar layout .TXT</a>).</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/313250-1775570645613.png\" alt=\"Gerador de importações Único\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/262202-1747066227743.png\" alt=\"Tela do sistema Único\">\n<h2>▶️ Importação (TXT)</h2>\n<ol>\n<li>No módulo Contábil do Único, acesse <b>Integrações › Importações › Lançamentos Contábeis via arquivo TXT</b>.</li>\n<li>Preencha <b>Empresa</b>, <b>Período</b> e <b>caminho do arquivo TXT</b>.</li>\n<li>Clique no <b>check azul</b> para carregar os lançamentos.</li>\n<li>Com os dados em tela, clique no ícone com a <b>flecha verde horizontal ➡</b> para confirmar a importação.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/262206-1747069132730.png\" alt=\"Importação Único 1\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/262207-1747069161276.png\" alt=\"Importação Único 2\">\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Duplicatas", "h": "<h2>📌 Visão geral</h2>\n<p>A <b>Leitura e Exportação de Duplicatas – SCI Único</b> permite vincular e baixar duplicatas do Automation integrando com o ERP Único.</p>\n<h2>📤 Exportação dos relatórios (Único)</h2>\n<p><b>Parcelamento/Duplicata:</b> no <b>Único Fiscal</b>, acesse <b>Relatórios › Gerenciais › Conferências › Parcelamento/duplicatas</b>, selecione o período, gere <b>Contas a Receber/Pagar</b> e imprima em <b>PDF</b>.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/326429-1778172491307.png\" alt=\"Parcelamento/duplicatas\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/326433-1778172773531.png\" alt=\"Impressão em PDF\">\n<p><b>Entradas/Saída/Serviço:</b> em <b>Lançamentos › entradas/saída/serviço</b> (gera 3 arquivos), selecione o mês com lançamentos (tecla <b>F9</b>), clique em <b>Imprimir</b> e selecione o arquivo <b>.XLS</b>.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/326445-1778173802741.png\" alt=\"Entradas/saída/serviço\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/326455-1778174219627.png\" alt=\"Exportar XLS\">\n<h2>📥 Importação no Automation</h2>\n<ol>\n<li>Na tela de <b>Extrato Bancário</b>, anexe os relatórios como <b>documentos auxiliares</b>.</li>\n<li>Clique na flecha à esquerda do lançamento, edite <b>Juros/Multa, Desconto e Valor pago</b> quando necessário e use <b>Aplicar sugestão</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/278886-1754924893535.png\" alt=\"Anexar relatórios\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/278895-1754925358594.png\" alt=\"Lista de duplicatas\">\n<h2>⚙️ Multa, juros e desconto</h2>\n<p>Para a rotina de duplicatas, configure <b>Multa, Juros e Desconto</b> por empresa.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/332298-1779190009620.png\" alt=\"Configuração multa/juros/desconto\">\n<h2>🔗 Regras de vínculo automático de duplicatas</h2>\n<p>O sistema aplica estratégias automáticas de vinculação. Nesses casos, os lançamentos já vêm com a origem marcada como <b>Duplicata</b> e vinculados automaticamente após a leitura.</p>\n<p><b>1ª estratégia — por nº de documento (prioritária):</b> vincula quando o lançamento e a duplicata têm o mesmo número de documento. Atendida a condição, todas as duplicatas são vinculadas; se o valor em aberto for maior que o do lançamento, aplica <b>baixa parcial</b> gerando juros/multa (do mais antigo para o mais recente).</p>\n<div class=\"bad\">⚠️ As demais regras só são aplicadas se a coluna “Documento” estiver vazia.</div>\n<p><b>Alternativa:</b> se o nº de documento estiver na coluna <b>Complemento</b> e for igual ao da duplicata, o vínculo é feito seguindo as mesmas regras.</p>\n<p><b>2ª estratégia — por data e valor:</b> mesmo valor do lançamento e vencimento dentro de um intervalo de até 2 dias antes ou depois da data do extrato, sem vínculos anteriores.</p>\n<p><b>3ª estratégia — por valor e nome do fornecedor ou CPF/CNPJ:</b> valor exato + nome do fornecedor ou CPF/CNPJ (com ou sem máscara).</p>\n<div class=\"bad\">⚠️ O vínculo automático ocorre apenas em correspondência <b>1 para 1</b> ou <b>1 para N</b> (um lançamento do extrato para uma ou várias duplicatas). Não vincula automaticamente <b>N:1</b> (várias movimentações do extrato para uma única duplicata).</div>\n<h2>🎛️ Regras de seleção</h2>\n<ul>\n<li><b>Recebimento</b> — quando a conta do banco está debitando (saída no extrato).</li>\n<li><b>Pagamento</b> — quando a conta do banco está creditando (entrada no extrato).</li>\n<li><b>Baixa parcial</b> — dá para selecionar a mesma duplicata várias vezes até quitar o valor.</li>\n<li><b>Múltiplas duplicatas</b> — dá para vincular mais de uma ao mesmo lançamento (ex.: várias parcelas juntas).</li>\n</ul>\n<h2>📦 Exportar para o SCI</h2>\n<ol>\n<li>No <b>Único Fiscal</b>, acesse <b>Integrações › Importações › Layout Padrão SCI › Duplicatas e pagamento</b>.</li>\n<li>Selecione a <b>empresa</b>, informe <b>data inicial</b> e <b>final</b>, selecione o arquivo e confirme a importação.</li>\n<li>Ao subir os lançamentos, o sistema redireciona para a tela de importação; quando todos subirem, clique em <b>Importar dados</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/332342-1779191634177.png\" alt=\"Layout padrão SCI\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/332350-1779191769325.png\" alt=\"Empresa e datas\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/332358-1779192081009.png\" alt=\"Importar dados\">\n<h2>🎯 Observações importantes</h2>\n<ul>\n<li>Duplicatas não usam as configurações padrão de contrapartida do Automation, apenas para multa, juros e desconto.</li>\n<li>Lançamentos vinculados como duplicata não podem ter contrapartida configurada, ter campos editáveis alterados depois do vínculo, nem ser exportados na rotina contábil comum (somente no arquivo específico de duplicatas).</li>\n</ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Participantes", "h": "<h2>👀 Visão geral</h2>\n<p>Como exportar, no <b>SCI Único</b>, os dados dos <b>participantes</b> para uso no Automation. Há duas formas: pelos <b>livros fiscais</b> (registros de entrada, saída e serviços) ou diretamente pelo <b>cadastro de participantes</b>.</p>\n<h2>📚 Pelos livros fiscais</h2>\n<p>No módulo Fiscal, em <b>Relatórios › Livros fiscais</b>, há três relatórios a exportar: <b>Registro de Entrada</b>, <b>Registro de Saída</b> e <b>Registro de Serviços</b>.</p>\n<div class=\"bad\">⚠️ A exportação traz todas as empresas e pode demorar. Se necessário, reduza o período selecionado.</div>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264717-1748526207607.png\" alt=\"Livros fiscais Único\">\n<h3>Registro de Entrada</h3>\n<p>Em <b>Registro de Entrada</b>, configure: <b>Empresa</b> em branco (todas); <b>período</b> dos últimos 6 meses; <b>Imprimir</b> = Não imprimir; <b>Participantes</b> = Imprimir Participantes e Somente Participantes. Clique em <b>Exportar Para › Separado por vírgula (CSV) sem quebra de página</b>.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264720-1748526809308.png\" alt=\"Registro de entrada\">\n<h3>Registro de Saída</h3>\n<p>Mesma configuração, mas em <b>Participantes</b> selecione <b>Imprimir Participantes e Lista de Códigos de Participantes</b>. Exporte em CSV.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264722-1748526986698.png\" alt=\"Registro de saída\">\n<h3>Registro de Serviços</h3>\n<p>Configure Empresa em branco, período de 6 meses, <b>Tipo de Lançamento = Emitidos e Tomados</b>, Imprimir = Não imprimir e <b>Participantes = Imprimir terceiros e Lista de Terceiros</b>. Exporte em CSV.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/264724-1748527070230.png\" alt=\"Registro de serviços\">\n<h2>🗂️ Pelo cadastro de participantes</h2>\n<ol>\n<li>No módulo contábil ou fiscal, acesse <b>Cadastro › Participantes</b> e clique na <b>lupa</b>.</li>\n<li>Clique em <b>Imprimir</b>, selecione as colunas <b>Código, Nome e CNPJ/CPF/CIE</b> e exporte como planilha.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/296145-Captura%20de%20tela%202025-09-01%20173239%20%282%29.png\" alt=\"Cadastro de participantes\">\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}]]}, "NAV"
