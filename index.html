:root{--teal:#1A6788;--teal-d:#1A507A;--ink:#243038;--muted:#66727a;--bg:#ffffff;--panel:#f5f8f9;--line:#e4eaed;}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
.app{display:flex;min-height:100vh;}
aside{width:280px;flex:0 0 280px;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding-bottom:30px;}
.brand{padding:22px 16px 16px;text-align:center;border-bottom:1px solid var(--line);}.brand img{height:34px;}
.prog{font-size:11px;color:var(--muted);text-align:center;padding:8px 0 0;}
.search{padding:12px 14px 6px;}.search input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);font-size:14px;background:#fff;}
nav{padding:6px 10px;}.grp>.hd{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#93a2ab;padding:11px 10px 5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;user-select:none;}.grp>.hd:hover{color:var(--teal-d);}.grp>.hd .car{font-size:9px;color:#aab6bd;transition:transform .15s;}.grp.open>.hd .car{transform:rotate(90deg);}.grp .sublist{display:none;}.grp.open .sublist{display:block;}
nav a{display:block;color:#3f4d56;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:14px;cursor:pointer;}
nav a.sub{padding-left:22px;font-size:13.5px;color:#5a6870;}nav a:hover{background:#e8eff1;color:var(--teal-d);}
nav a.active{background:var(--teal);color:#fff;font-weight:600;}
main{flex:1;min-width:0;padding:34px 46px;}
.crumb{font-size:12px;color:var(--muted);margin-bottom:8px;}h1{font-size:28px;color:var(--teal-d);margin:0 0 6px;}
.sub{color:var(--muted);margin:0 0 22px;}
.artview{display:grid;grid-template-columns:1fr 240px;gap:36px;align-items:start;}
.content h2{font-size:20px;color:var(--teal-d);margin:26px 0 10px;}.content p{margin:10px 0;}
.content ul,.content ol{margin:10px 0 10px 22px;}.content li{margin:6px 0;}.content b{color:var(--ink);}
.content img{max-width:100%;border:1px solid var(--line);border-radius:8px;margin:12px 0;display:block;}
.content img + p{margin-top:34px;}.content p + p:has(>b:first-child){margin-top:34px;}
.content .ok{background:#e9f6ec;border:1px solid #bfe3c7;border-radius:9px;padding:11px 14px;margin:12px 0;color:#1f7a34;}
.content .bad{background:#fdece8;border:1px solid #f2c9bf;border-radius:9px;padding:11px 14px;margin:12px 0;color:#a83a22;}
.content a{color:var(--teal-d);}
.content table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px;}
.content th,.content td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;}
.content th{background:#eef4f5;color:var(--teal-d);}
.toc{position:sticky;top:24px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;}
.toc h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);}
.toc a{display:block;color:#4b5860;text-decoration:none;padding:4px 0 4px 10px;border-left:2px solid transparent;}
.toc a:hover{color:var(--teal-d);border-left-color:var(--teal);}
.arts{max-width:840px;}
.art{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin:8px 0;color:var(--ink);}
.art.own{cursor:pointer;} .art.own:hover{border-color:#bcd6dd;box-shadow:0 3px 10px rgba(0,0,0,.05);}
.art.pend{opacity:.6;}
.tag{font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap;}
.tag.own{background:#e3f3e6;color:#1f7a34;}.tag.pend{background:#eef2f3;color:#8a97a0;}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;max-width:1000px;}
.hcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;}.hcard:hover{border-color:#bcd6dd;}
.hcard h3{margin:0 0 4px;font-size:15px;color:var(--teal-d);}.hcard p{margin:0;font-size:13px;color:var(--muted);}
.burger{display:none;position:fixed;top:12px;left:12px;z-index:20;background:var(--teal-d);color:#fff;border:0;border-radius:8px;padding:8px 11px;font-size:16px;}
@media(max-width:900px){.artview{grid-template-columns:1fr;}.toc{order:-1;position:static;}}

order-radius:20px;padding:3px 12px;font-size:13px;font-weight:600;\">📦 Versão v1.10.0.0</span></p><h2>🚀 Inovação</h2><p>✔️ <b>Open Finance — busca automática de extratos bancários.</b> <a href=\"https://pilarsistemas.tomticket.com/kb/contabil/open-finance\" target=\"_blank\" rel=\"noopener\">Mais detalhes</a>.</p><p>✔️ <b>Integração 100% automática</b> de entrada, saída e serviços (NF-e/NFC-e/NFS-e) para a <b>Domínio Sistemas</b>.</p><p>✔️ <b>ISS Rio do Sul (SC)</b> — cidade liberada.</p><h2>🐞 Correções</h2><ul><li>✔️ Extrato do banco BRB que não estava sendo lido.</li><li>✔️ ISS — integração automática Domínio: aplicada a regra oficial de valor unitário (que nem sempre deve ser levado).</li><li>✔️ ISS — duplicação de PDFs por nome de arquivo sem o número da nota.</li><li>✔️ ISS Caxias do Sul — passa a considerar notas para CNPJ, CPF e também sem informar o tomador.</li></ul><h2>🎯 Observações</h2><p>Em caso de dúvidas ou necessidade de suporte, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>"}]], "cad": ["🗂️ Cadastros", [{"t": "Certificados Digitais", "h": "<h2>📌 Visão geral</h2>\n<p>Este manual orienta o uso da área de <b>Certificados Digitais</b> da plataforma. A funcionalidade centraliza a gestão dos certificados usados nas rotinas automatizadas, com controle, segurança e eficiência.</p>\n<h2>📂 Tela de consulta de certificados</h2>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/309585-1774633854171.png\" alt=\"Consulta de certificados digitais\">\n<p>Nesta tela você visualiza todos os certificados cadastrados. Recursos:</p>\n<ul>\n<li><b>Buscar por nome</b> — localize certificados digitando a razão social ou parte do nome do arquivo.</li>\n<li><b>Vencimento</b> — filtra pela situação do certificado: <b>válido</b>, <b>vencido</b> ou <b>prestes a vencer</b>.</li>\n<li><b>➕ Novo</b> — adiciona um novo certificado (canto superior direito).</li>\n</ul>\n<p><b>Colunas:</b></p>\n<ul>\n<li><b>Nome</b> — nome do certificado cadastrado.</li>\n<li><b>Ações</b> — visualizar, atualizar, alterar ou excluir.</li>\n<li><b>Rotinas vinculadas</b> — processos ou módulos que usam o certificado.</li>\n<li><b>Vencimento</b> — data de validade, para acompanhar a renovação.</li>\n<li><b>Procuração</b> — indica se o certificado possui procuração ativa.</li>\n</ul>\n<h2>📝 Cadastro de certificado</h2>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/306213-Screenshot_8.png\" alt=\"Cadastro de certificado digital\">\n<p>Aqui você faz o upload do certificado, informa a senha e vincula as empresas que irão utilizá-lo.</p>\n<ul>\n<li><b>Upload do certificado</b> — selecione o arquivo <b>.pfx</b>.</li>\n<li><b>Senha</b> — digite a senha do certificado com atenção.</li>\n<li><b>Por procuração</b> — marque se o certificado será usado com procuração eletrônica.</li>\n<li><b>Vincular empresas</b> — à direita, localize as empresas disponíveis e clique em <b>Vincular todas</b> ou selecione uma a uma. As escolhidas aparecem à esquerda como vinculadas.</li>\n</ul>\n<div class=\"bad\">⚠️ <b>Atenção:</b> é possível vincular a mesma empresa em mais de um certificado, para casos em que a procuração existe em uma rotina e em outra não. Ex.: DCTFWeb e Leão têm procuração, mas a Nota Nacional não — sendo necessário cadastrar mais de um certificado para a empresa.</div>\n<p><b>Botões:</b> <b>Salvar</b> (grava o certificado e os vínculos) · <b>Cancelar</b> (descarta as alterações) · <b>Desvincular todas</b> (remove todas as empresas vinculadas).</p>\n<h2>🔗 Rotinas vinculadas</h2>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/306224-Screenshot_10.png\" alt=\"Rotinas vinculadas ao certificado\">\n<p>Esta aba associa o certificado a rotinas automatizadas, por esfera:</p>\n<ul>\n<li><b>Federal</b> — escolha a rotina (Leão, DCTFWeb) e confirme (✔️), exclua (🗑️) ou adicione (➕).</li>\n<li><b>Estadual</b> — escolha a rotina e o estado, e confirme (✔️) ou adicione (➕).</li>\n<li><b>Municipal</b> — escolha a rotina (NFS-e ou Nota Nacional), informe o município ou sistema e marque <b>Por sistema</b> quando a integração for com sistemas padronizados.</li>\n</ul>\n<p>Finalize com <b>Salvar</b> ou <b>Cancelar</b>.</p>\n<h2>💡 Dicas e boas práticas</h2>\n<ul>\n<li>Mantenha os certificados sempre atualizados, para evitar falhas nas rotinas.</li>\n<li>Use nomes de arquivo claros e padronizados para facilitar as buscas.</li>\n<li>Para certificados com procuração, confirme que a procuração está válida e ativa na Receita.</li>\n<li>Revise periodicamente as empresas vinculadas, sobretudo após mudanças de cliente ou de estrutura societária.</li>\n</ul>\n<h2>💬 Suporte</h2>\n<p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Contadores", "h": "<h2>📌 Visão geral</h2>\n<p>O <b>Cadastro de Contadores</b> permite gerenciar os profissionais responsáveis pelas obrigações fiscais das empresas vinculadas. Você pode cadastrar, editar, remover e associar empresas e rotinas de acesso.</p>\n<h2>📂 Tela de consulta de contadores</h2>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/261885-1746841505983.png\" alt=\"Consulta de contadores\">\n<p>Nesta tela você vê a lista de contadores cadastrados.</p>\n<ul>\n<li>🔍 <b>Buscar por nome, CPF ou CRC</b> — localize rapidamente um contador.</li>\n<li>➕ <b>Novo</b> — abre a tela de cadastro (canto superior direito).</li>\n</ul>\n<p><b>Informações exibidas:</b> nome, CPF e CRC (registro profissional).</p>\n<p><b>Ações:</b> ✏️ editar · 🗑️ remover (exclui o contador do sistema).</p>\n<h2>📝 Cadastro / edição de contador</h2>\n<p>Preencha os dados pessoais e vincule as empresas sob responsabilidade do contador.</p>\n<ul>\n<li><b>Nome completo</b>, <b>CRC</b> e <b>CPF</b>.</li>\n<li><b>Telefone</b> e <b>E-mail</b> — opcionais, mas recomendados para contato direto.</li>\n</ul>\n<h2>🏢 Vincular empresas ao contador</h2>\n<p>O contador pode ser vinculado a uma ou mais empresas da base.</p>\n<ul>\n<li><b>Empresas não vinculadas</b> — busque à direita e clique em <b>Vincular todas</b> ou selecione individualmente.</li>\n<li><b>Empresas vinculadas</b> — aparecem à esquerda; use <b>Desvincular todas</b> para limpar a lista.</li>\n</ul>\n<h2>🔐 Senhas de acesso</h2>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/261887-1746842401595.png\" alt=\"Senhas de acesso do contador\">\n<p>Cadastre as credenciais usadas pelo contador para acessar sistemas e obrigações fiscais, por esfera:</p>\n<ul>\n<li><b>Federal</b> — rotina (ex.: e-CAC), acesso (usuário ou e-mail) e senha.</li>\n<li><b>Estadual</b> — rotina, estado correspondente, acesso e senha.</li>\n<li><b>Municipal</b> — rotina, município ou sistema (marque <b>Por sistema</b> quando o acesso for pelo sistema), acesso e senha.</li>\n</ul>\n<p><b>Ações da linha:</b> ✔️ confirmar · 🗑️ excluir · ➕ adicionar. Finalize com <b>Salvar</b> ou <b>Cancelar</b>.</p>\n<div class=\"bad\">⚠️ <b>Atenção:</b> não é possível buscar notas de serviço tomadas e prestadas pelo <b>Portal Nacional</b> usando o cadastro do <b>Contador</b>. Consulte o artigo <b>NFS-e — Portal Nacional (FAQ)</b>.</div>\n<h2>💡 Dicas e boas práticas</h2>\n<ul>\n<li>Atualize os dados sempre que houver troca de senha ou de acesso do contador.</li>\n<li>As senhas cadastradas são usadas automaticamente pelos robôs nas rotinas correspondentes.</li>\n<li>Use senhas fortes e restrinja o acesso a profissionais autorizados.</li>\n<li>Vincular corretamente empresas e rotinas evita falhas nas automações fiscais.</li>\n</ul>\n<h2>💬 Suporte</h2>\n<p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Empresas", "h": "<h2>📌 Visão geral</h2>\n<p>O <b>Cadastro de Empresas</b> permite gerenciar por completo os dados cadastrais, fiscais e bancários das empresas na plataforma. É possível cadastrar, editar, importar/exportar empresas e manter os dados atualizados para o bom funcionamento das rotinas automatizadas.</p>\n<h2>🧾 Tela de consulta de empresas</h2>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/261892-1746846504337.png\" alt=\"Consulta de empresas\">\n<p>Nesta tela você visualiza todas as empresas cadastradas com seus principais dados.</p>\n<p><b>Funcionalidades:</b></p>\n<ul><li>Buscar por razão social ou CNPJ.</li><li>Filtro de status: ativas, inativas ou todas.</li><li>Importar e exportar empresas em massa.</li><li>Remover empresas selecionadas.</li><li>Cadastrar nova empresa (botão ➕ Novo).</li></ul>\n<p><b>Dados exibidos:</b> CNPJ, Razão Social, Tipo (matriz/filial), Status, Regime tributário, Inscrição estadual e Cidade. Ações: ✏️ editar · 🗑️ remover.</p>\n<h2>🔁 Importar e exportar em massa</h2>\n<p><b>Importar:</b> clique em <b>Importar</b> e anexe um arquivo com os dados das empresas. Formatos aceitos:</p>\n<ul><li><b>.TXT</b> — um CNPJ por linha: <i>CNPJ</i> ou <i>CNPJ;Nome da empresa</i>.</li><li><b>.XLSX</b> — cabeçalho com as colunas <b>CNPJ/CPF</b> e <b>Empresa</b>.</li></ul>\n<p>Os dois campos são obrigatórios em todas as linhas. Antes de concluir, selecione o <b>Sistema Contábil</b> correspondente e clique em <b>Importar</b>.</p>\n<p><b>Exportar:</b> clique em <b>Exportar</b> para gerar um arquivo <b>.XLSX</b> com as empresas da tela atual (respeitando o filtro aplicado).</p>\n<h2>📝 Cadastro de empresa</h2>\n<p>O cadastro é dividido em abas.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/302618-1772215673548.png\" alt=\"Aba Geral do cadastro de empresa\">\n<p><b>Aba Geral:</b> reúne as informações cadastrais essenciais.</p>\n<ul>\n<li><b>Identificação</b> — tipo de inscrição (CNPJ/CPF) e número. Ao clicar na 🔍 <b>lupa</b>, o sistema consulta a Receita Federal e preenche automaticamente razão social, nome fantasia, natureza jurídica, endereço e situação cadastral (evita erros de digitação).</li>\n<li><b>Organizacionais</b> — razão social, nome fantasia, tipo (matriz/filial), empresa matriz, Plano de Contas e Plano de Histórico vinculados, contador responsável, certificados digitais e capital social.</li>\n<li><b>Estrutura e regime fiscal</b> — regime tributário, natureza jurídica, sistema contábil, código de integração, situação (ativa/inativa), inscrições estadual e municipal e datas (situação, cadastro e última alteração).</li>\n<li><b>SPED Fiscal</b> (opcional) — perfil SPED, datas de credenciamento, situação no Simples Nacional e no SIMEI.</li>\n<li><b>CNAE</b> — CNAE principal e secundários (✔️ confirmar · 🗑️ excluir · ➕ incluir).</li>\n<li><b>Contato e notificações</b> — nome e e-mail do contato, telefones e e-mail para notificações automáticas.</li>\n<li><b>Endereço</b> — CEP com 🔍 lupa para preencher automaticamente, número, complemento e bairro.</li>\n</ul>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/261889-1746845577530.png\" alt=\"Aba Sócio\">\n<p><b>Aba Sócio:</b> cadastre os sócios (nome/razão social, CPF/CNPJ, qualificação e descrição). ➕ Novo para adicionar · 🗑️ para remover.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/302284-1772031560412.png\" alt=\"Aba Senhas de Acesso\">\n<p><b>Aba Senhas de Acesso:</b> rotina (ex.: PGDAS, Sintegra), tipo de acesso (Contador, Empresa ou Certificado Digital — preenchido automaticamente, apenas para consulta), acesso (usuário/e-mail) e senha. ➕ adicionar · 🗑️ remover · ✔️ confirmar.</p>\n<div class=\"bad\">⚠️ <b>Atenção:</b> os tipos de acesso <b>Certificado Digital</b> e <b>Contador</b> aqui são apenas para consulta. Para editar, use os menus <b>Certificado Digital</b> ou <b>Contador</b>.</div>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/261891-1746845801389.png\" alt=\"Aba Dados Bancários\">\n<p><b>Aba Dados Bancários:</b> tipo de conta, banco, agência, número da conta e dígito verificador. ➕ adicionar · 🗑️ excluir · ✔️ confirmar.</p>\n<h2>💡 Dicas e boas práticas</h2>\n<ul><li>Mantenha os dados sempre atualizados para evitar falhas nas rotinas.</li><li>Preencha todos os campos obrigatórios antes de salvar.</li><li>Use nomes e identificações padronizadas para facilitar buscas e relatórios.</li><li>Revise os dados antes de rodar rotinas automatizadas.</li></ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Open Finance", "h": "<h2>📌 Visão geral</h2>\n<p>O <b>Cadastro Open Finance</b> integra contas bancárias diretamente à plataforma, com <b>conectividade segura</b> 🔒, <b>centralização dos dados financeiros</b> 📊 e <b>recebimento automático dos extratos em tempo real</b> ⚡. É possível cadastrar, visualizar, conectar ou desconectar contas de diferentes bancos, acompanhar o status de ativação e vincular contas ao <b>plano de contas contábil</b>.</p>\n<p><b>O que é o Open Finance?</b> É a tecnologia que integra bancos e sistemas diretamente, eliminando processos manuais e dando mais agilidade ao dia a dia contábil.</p>\n<h2>🧾 Cadastro de nova conta</h2>\n<ol>\n<li>Clique em <b>➕ Novo</b>.</li>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/331654-Novo.png\" alt=\"Botão Novo\">\n<li>Preencha os campos da conta.</li>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/303980-1773750037854.png\" alt=\"Campos da conta Open Finance\">\n<li>Envie o <b>link de conexão</b> ao cliente.</li>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/303984-1773750467093.png\" alt=\"Envio do link de conexão\">\n<li>Após o envio, a conexão passa a exibir um <b>status</b> (ver abaixo).</li>\n</ol>\n<h2>📂 Consulta de contas</h2>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/285537-1759167190146.png\" alt=\"Consulta de contas Open Finance\">\n<p><b>Status possíveis:</b></p>\n<ul>\n<li>🟢 <b>Conectada</b> — integrada com sucesso.</li>\n<li>🟠 <b>Link enviado</b> — link gerado e enviado ao cliente.</li>\n<li>🟠 <b>Aguardando conexão</b> — aguardando autorização.</li>\n<li>🟠 <b>Conta inválida</b> — conta/agência não encontradas (registrado no histórico da conta).</li>\n<li>🔴 <b>Desconectada</b> — conta não ativa no momento.</li>\n<li>🔴 <b>Não autorizado</b> — conexão recusada.</li>\n<li>🔴 <b>Erro de conexão</b> — o banco não concluiu a integração (registrado no histórico).</li>\n</ul>\n<p><b>Dados por conta:</b> nome, tipo, banco, número (conta e dígito), agência e data de ativação.</p>\n<p><b>Ações por conta:</b> editar, excluir e, no menu (☰): conectar, desconectar, reenviar notificação por e-mail, copiar link de conexão para WhatsApp, copiar link simples e ver o histórico da conta.</p>\n<h2>⚙️ Ações por empresa</h2>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/285525-1759165237971.png\" alt=\"Ações por empresa\">\n<p>A tela lista as empresas com contas integradas. Expanda uma empresa (seta ao lado do nome) para ver as contas vinculadas. É possível <b>buscar por nome</b>, <b>editar</b> as contas e <b>excluir todas as conexões</b> da empresa.</p>\n<h2>📝 Edição — dados da conta</h2>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/285522-1759164263944.png\" alt=\"Edição dos dados da conta\">\n<ul>\n<li><b>Empresa</b> — pré-selecionada no topo.</li>\n<li><b>Status</b> — filtro (conectadas, desconectadas, todas).</li>\n<li><b>Nome da conta</b> — aparece na seleção em <b>Contábil › Extrato Bancário</b>.</li>\n<li><b>Tipo</b> — tipo de lançamentos da conta.</li>\n<li><b>Banco</b> — selecione sempre a opção que contém <b>Open Finance</b>.</li>\n<li><b>Nº da conta (com dígito)</b> — inclua o dígito verificador; ele é essencial para a conexão correta.</li>\n<li><b>Agência</b>, <b>Data de ativação</b> (automática) e <b>Conta contábil</b> (vincula a conta bancária ao plano de contas).</li>\n</ul>\n<h2>💡 Dicas e boas práticas</h2>\n<ul><li>Mantenha o status em <b>Conectada</b> para garantir a automação dos extratos.</li><li>Se o cliente não receber o e-mail, use <b>Reenviar notificação</b>.</li><li>Confirme os dados bancários antes de salvar.</li><li>Use nomes claros e padronizados (ex.: “BB PJ”, “Santander MEI”).</li><li>Veja contas inválidas ou erros no <b>Histórico da conta</b> para corrigir rápido.</li></ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Planilhas", "h": "<h2>📌 Para que serve a planilha?</h2>\n<p>Nesta tela você <b>cadastra planilhas</b> enviadas pelos clientes (ou exportadas de ERPs) e as <b>configura</b> no padrão da sua contabilidade, para depois definir as contrapartidas no <b>Extrato Bancário</b>. Você pode:</p>\n<ul><li><b>Configurar planilhas por empresa</b> (quando o cliente envia um arquivo próprio); e</li>\n<li><b>Configurar planilhas por sistema (ERP)</b> para reaproveitar a mesma configuração em várias empresas que usam o mesmo ERP.</li></ul>\n<h2>🧭 Visualização</h2>\n<p>Acesse <b>Cadastros › Planilhas</b>. A lista é agrupada por <b>Empresas</b> e por <b>Sistemas</b>, facilitando identificar configurações gerais (por ERP) e específicas da empresa.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/289153-1761685429202.png\" alt=\"Listagem de planilhas\">\n<h2>🧾 Cadastro (nova planilha)</h2>\n<p>Clique em <b>➕ Novo</b> e preencha os campos.</p>\n<p><b>Relacionamento da planilha:</b></p>\n<ul>\n<li><b>Relatório por</b> (obrigatório): <b>Empresa (específico)</b> quando o layout é exclusivo de uma empresa; <b>Sistema Financeiro (geral)</b> quando vem de um ERP e poderá ser usado por várias empresas.</li>\n<li><b>Empresa</b> (só em Específico) ou <b>Sistema já cadastrado</b> (só em Geral, para reutilizar).</li>\n<li><b>Nome do sistema</b> — ERP que originou o arquivo (ex.: Kontamos, Conta Azul).</li>\n<li><b>Nome da planilha</b> (obrigatório) — nome único.</li>\n<li><b>Plano de contas</b> (só em Geral) e <b>Conta contábil</b> — usada para lançamentos sem mapeamento explícito.</li>\n<li><b>Descrição</b> — finalidade da planilha.</li>\n</ul>\n<p><b>Tipo de arquivo</b> — informa como o sistema deve tratar os dados:</p>\n<ul>\n<li><b>Extrato sem conta banco</b> — espelho do extrato sem precisar configurar conta bancária.</li>\n<li><b>Cartão de crédito</b> — relatório de transações (valor líquido e tarifa).</li>\n<li><b>Extrato</b> — espelho do banco (entradas/saídas efetivadas); base da conciliação.</li>\n<li><b>Pagamento</b> — saídas para quitar contas; ajuda na baixa do Contas a Pagar.</li>\n<li><b>Recebimento</b> — entradas de clientes/cartões; ajuda na baixa do Contas a Receber.</li>\n<li><b>Movimentação</b> — pagamentos + recebimentos juntos (use só se não der para separar).</li>\n</ul>\n<p><b>Estrutura do arquivo:</b> informe a <b>linha de cabeçalho</b> (obrigatório). Formatos: <b>XLS, XLSX, CSV</b> (todos exigem cabeçalho).</p>\n<div class=\"bad\">🔥 <b>Limitações:</b> apenas uma aba por arquivo; <b>colunas mescladas não são suportadas</b>; <b>cabeçalhos com mais de uma linha não são suportados</b>. Garanta tipos de dados consistentes (datas/valores).</div>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/289185-1761739691141.png\" alt=\"Estrutura do arquivo\">\n<h2>⚙️ Configuração (Tags)</h2>\n<p>Ao anexar o arquivo, o sistema faz a leitura e mostra uma prévia. <b>Remova as colunas</b> que não serão usadas (🗑️) e <b>atribua tags</b> às colunas úteis (menu ⬇️ no cabeçalho). As tags <b>não são cumulativas</b>: cada coluna tem apenas uma tag principal.</p>\n<table>\n<tr><th>Tag</th><th>Obrigatório</th><th>Uso</th></tr>\n<tr><td><b>Data</b></td><td>Sim</td><td>Data do lançamento.</td></tr>\n<tr><td><b>Valor</b></td><td>Extrato / Extrato sem conta</td><td>Valor do lançamento (débito ou crédito). Sem sinal, use <b>Tipo D/C</b>.</td></tr>\n<tr><td><b>Valor pago</b></td><td>Pagamento</td><td>Valor pago (sempre débito).</td></tr>\n<tr><td><b>Valor recebido</b></td><td>Recebimento</td><td>Valor recebido (sempre crédito).</td></tr>\n<tr><td><b>Valor original</b></td><td>Não</td><td>Valor antes de juros/descontos.</td></tr>\n<tr><td><b>Valor juros</b></td><td>Não</td><td>Apenas o valor dos juros.</td></tr>\n<tr><td><b>Valor desconto</b></td><td>Não</td><td>Apenas o valor do desconto.</td></tr>\n<tr><td><b>Valor líquido</b></td><td>Cartão de crédito</td><td>Valor líquido (débito automático).</td></tr>\n<tr><td><b>Valor de tarifa</b></td><td>Cartão de crédito</td><td>Valor da tarifa (débito automático).</td></tr>\n<tr><td><b>Documento</b></td><td>Não</td><td>Número do documento.</td></tr>\n<tr><td><b>Tipo D/C</b></td><td>Não</td><td>Define débito/crédito quando o valor não traz sinal (D/C, Débito/Crédito).</td></tr>\n<tr><td><b>Participante</b></td><td>Não</td><td>Cliente/fornecedor (ERPs Visual e Único).</td></tr>\n<tr><td><b>Complemento</b></td><td>Sim</td><td>Composição do histórico/descrição.</td></tr>\n</table>\n<p><b>Complemento (composição):</b> marque a tag <b>Complemento</b> em uma coluna base, clique na engrenagem ⚙️ e escolha quais colunas compõem o texto e em que ordem (ex.: Histórico + Número + Observação). Evite os separadores <b>;</b> e <b>|</b> (usados em layouts de exportação).</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/289156-1761685633868.png\" alt=\"Configuração do complemento\">\n<h2>✅ Regras e validações automáticas</h2>\n<ul><li><b>Cabeçalho obrigatório</b> — sem ele o arquivo não é aceito.</li><li><b>Data válida</b> — dd/mm/aaaa ou ISO; datas inválidas são rejeitadas.</li><li><b>Valor numérico</b> — separe milhar/decimal corretamente.</li><li><b>Tipo D/C</b> — quando presente, padronizado (D/C ou Débito/Crédito).</li><li><b>Conta contábil (fallback)</b> — se a coluna de conta não for configurada, usa a conta contábil do cadastro da planilha.</li></ul>\n<h2>💡 Boas práticas</h2>\n<ul><li>Padronize os nomes (ex.: “ERP – Nome do layout – v1”).</li><li>Valide com amostras reais do cliente antes de liberar em produção.</li><li>Evite colunas mescladas e múltiplas abas.</li><li>Mantenha um catálogo de ERPs e layouts já homologados para reaproveitar.</li></ul>\n<h2>🛠️ Solução de problemas</h2>\n<ul><li><b>Não lê o arquivo</b> — verifique a linha de cabeçalho e colunas mescladas.</li><li><b>Datas erradas</b> — confirme o padrão pt-BR e se a coluna é data (não texto).</li><li><b>Valores com vírgula/ponto</b> — padronize como número; evite “R$” no campo de valor.</li><li><b>Complemento duplicado</b> — revise a composição.</li></ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Plano de Contas", "h": "<h2>📌 Visão geral</h2>\n<p>O módulo <b>Plano de Contas</b> permite estruturar, visualizar e importar o plano contábil da empresa ou do escritório. Também possibilita o vínculo com empresas da base e a diferenciação entre contas <b>sintéticas</b> e <b>analíticas</b>, essenciais para o controle e a automação contábil.</p>\n<h2>📂 Tela principal — Visualização do plano</h2>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/261893-1746848467668.png\" alt=\"Visualização do plano de contas\">\n<p>Aqui você consulta e gerencia a hierarquia de contas.</p>\n<ul><li><b>Busca por nome</b> da conta.</li><li>Botão ➕ Novo para cadastrar um plano.</li><li>Ações ✏️ editar e 🗑️ remover.</li></ul>\n<p><b>Colunas:</b></p>\n<ul><li><b>Conta ERP</b> — código interno do plano.</li><li><b>Classificação</b> — código contábil hierárquico (ex.: 1.1.1.01.0001).</li><li><b>Nome</b> — nome da conta (ex.: Caixa Geral).</li><li><b>Tipo</b> — <b>sintética</b> (agrupamento, não recebe lançamentos) ou <b>analítica</b> (recebe lançamentos).</li></ul>\n<h2>📝 Cadastro de plano de contas</h2>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/261894-1746848555510.png\" alt=\"Cadastro de plano de contas\">\n<p>Na criação ou edição, você pode:</p>\n<ul><li>Definir o <b>nome do plano</b>.</li><li><b>Importar</b> um plano pronto em <b>.xlsx</b> — clique no ícone de upload com interrogação para baixar o modelo de importação.</li></ul>\n<h2>🔗 Vincular empresas ao plano</h2>\n<ul><li>À esquerda: empresas <b>vinculadas</b>. À direita: <b>não vinculadas</b>.</li><li><b>Vincular todas</b> / <b>Desvincular todas</b> em um clique.</li><li>Use a busca para localizar empresas. Finalize com <b>Salvar</b> ou <b>Cancelar</b>.</li></ul>\n<h2>💡 Dicas e boas práticas</h2>\n<ul><li>Estruture o plano respeitando a hierarquia contábil (ex.: 1.1.1.01.0001).</li><li>Vincule ao menos uma empresa para o plano ter utilidade prática.</li><li>Mantenha nomes claros e padronizados para facilitar integrações e análises.</li><li>Use a importação para agilizar a criação, principalmente se já houver um modelo.</li></ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Plano de histórico", "h": "<h2>📌 Visão geral</h2>\n<p>O <b>Plano de Histórico</b> é essencial na automatização das rotinas contábeis. Ele define os textos que acompanham os lançamentos nos movimentos contábeis, padronizando a descrição das transações e dando clareza aos relatórios e livros contábeis.</p>\n<h2>📂 Tela principal — Listagem de históricos</h2>\n<p>Exibe todos os históricos disponíveis no sistema.</p>\n<ul><li><b>Busca por nome</b> do histórico.</li><li>Botão ➕ Novo para criar um plano de histórico.</li><li>Ações ✏️ editar e 🗑️ remover.</li></ul>\n<p><b>Colunas:</b> <b>Conta ERP</b> (código do histórico) e <b>Nome</b> (texto descritivo do lançamento, ex.: “PRESTAÇÃO DE SERVIÇOS NESTA DATA”).</p>\n<h2>📝 Cadastro de plano de histórico</h2>\n<ul><li>Defina o <b>nome do plano</b>.</li><li><b>Importe</b> um histórico usando o botão de upload — clique no ícone de interrogação com seta para baixar o modelo.</li></ul>\n<h2>🔗 Vincular empresas ao plano</h2>\n<ul><li>À esquerda: empresas <b>vinculadas</b>. À direita: <b>não vinculadas</b>.</li><li>Campo de busca para localizar. ➕ Vincular todas / ❌ Desvincular todas. Finalize com <b>Salvar</b> ou <b>Cancelar</b>.</li></ul>\n<h2>💡 Dicas e boas práticas</h2>\n<ul><li>Use descrições claras e padronizadas — elas aparecem nos lançamentos contábeis.</li><li>Combine com as regras de automação para agilizar ainda mais os lançamentos.</li><li>Use a importação quando já houver um modelo aprovado.</li><li>Use <b>#</b> para inserir datas automaticamente (ex.: <i>SALDO EM #</i> resulta em <i>SALDO EM 30/05/2025</i>).</li></ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Usuários", "h": "<h2>📌 Visão geral</h2>\n<p>A tela de <b>Usuários</b> permite ao administrador visualizar, cadastrar, editar, ativar/desativar e remover usuários do sistema de forma centralizada. Também é possível <b>vincular empresas</b> e configurar <b>permissões de acesso</b> para cada colaborador.</p>\n<h2>📂 Tela de consulta de usuários</h2>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/285515-1759161310896.png\" alt=\"Consulta de usuários\">\n<ul>\n<li>🔍 <b>Buscar</b> usuário pelo nome ou e-mail.</li>\n<li>➕ <b>Novo</b> — abre o formulário de cadastro.</li>\n<li>📤 <b>Enviar acesso</b> — envia por e-mail as instruções de acesso ao usuário.</li>\n<li>✏️ <b>Editar</b> — altera os dados do usuário.</li>\n<li>🗑️ <b>Remover</b> — marque a caixa ao lado do nome e clique em Remover.</li>\n<li>🟢 <b>Status</b> — o selo <b>Ativo</b> indica acesso habilitado.</li>\n</ul>\n<h2>📝 Cadastro / edição de usuário</h2>\n<p><b>Dados do usuário:</b> nome completo (como aparecerá no sistema).</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/285520-1759162496826.png\" alt=\"Dados do usuário\">\n<p><b>Dados de acesso:</b></p>\n<ul>\n<li><b>Login (e-mail)</b> — usado como nome de usuário.</li>\n<li><b>Administrador</b> — concede acesso e controle total sobre empresas e recursos.</li>\n<li><b>Senha inicial</b> — por padrão, informe <b>1234</b>. O usuário recebe um convite por e-mail e altera a senha no primeiro acesso.</li>\n<li><b>Confirmar senha</b> — repita a senha inicial.</li>\n</ul>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/285521-1759162518090.png\" alt=\"Dados de acesso\">\n<h2>🔗 Vincular empresas</h2>\n<p>Selecione as empresas que o usuário poderá acessar. Um usuário pode ter acesso a uma ou várias empresas; se nenhuma for vinculada, ele não acessa dados.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/285518-1759161544194.png\" alt=\"Vincular empresas ao usuário\">\n<div class=\"bad\">👉 Se a opção <b>Administrador</b> for marcada, a vinculação de empresas fica desabilitada e o usuário acessa automaticamente todas as empresas.</div>\n<h2>⚙️ Configuração de permissões</h2>\n<p>Define quais menus e funcionalidades o usuário pode acessar, em lista hierárquica (igual ao menu lateral). É possível habilitar ou restringir cada menu conforme a função.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/285519-1759161796136.png\" alt=\"Configuração de permissões\">\n<div class=\"bad\">👉 Se <b>Administrador</b> for marcada, o usuário acessa todos os recursos e a configuração de permissões fica desabilitada.</div>\n<h2>💾 Botões</h2>\n<p><b>Salvar</b> grava o usuário ou as alterações · <b>Cancelar</b> retorna sem salvar.</p>\n<h2>💡 Dicas e boas práticas</h2>\n<ul><li>Revise os dados antes de salvar.</li><li>Use senhas fortes.</li><li>Após cadastrar, use <b>Enviar acesso</b> para agilizar a ativação.</li><li>Ajuste permissões e empresas conforme mudanças no time.</li></ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}]], "con": ["🔍 Consultas", [{"t": "Contrapartida", "h": "<h2>📌 Visão geral</h2><p>A tela de <b>Contrapartidas</b> permite visualizar e remover as contrapartidas já cadastradas na tela de <b>Extrato Bancário</b>. Nela é possível:</p><ul><li>Visualizar empresas, contas e regras aplicadas.</li><li>Identificar rapidamente o tipo de regra configurada.</li><li>Pesquisar por complemento, empresa, conta, classificação ou regra.</li><li>Remover contrapartidas selecionadas.</li></ul><h2>🔎 Filtros superiores</h2><p>Na parte superior da tela ficam as ferramentas de busca e filtragem:</p><ul><li><b>Buscar por complemento:</b> pesquisa qualquer texto do campo <i>Complemento</i>.</li><li><b>Selecionar empresa:</b> filtra as regras de uma empresa específica.</li><li><b>Pesquisar por conta, classificação ou nome:</b> localiza contrapartidas vinculadas às contas contábeis da empresa. Como as contas são próprias de cada empresa, este campo só é ativado após escolher uma empresa.</li><li><b>Regra:</b> permite ver apenas regras dos tipos <b>Complemento Original</b>, <b>Complemento Parcial</b> e <b>Complemento Inicial</b>.</li></ul><img src='https://tomticket-galeria.s3.amazonaws.com/42292/343232-Screenshot_20.png' alt='Filtros das contrapartidas'><p>Esses filtros tornam a gestão das contrapartidas muito mais rápida e eficiente, especialmente para empresas com grande volume de regras.</p><h2>📋 Visualização das contrapartidas</h2><p>Apresenta as informações necessárias para entender e validar as contrapartidas configuradas:</p><ul><li><b>Empresa</b> — CNPJ, tipo (matriz/filial) e situação (ativa/inativa).</li><li><b>Conta</b> — conta de origem do lançamento do extrato.</li><li><b>Regra</b> — define como a contrapartida é aplicada:<ul><li><b>Original:</b> busca pelo complemento exato.</li><li><b>Parcial:</b> busca por uma ou mais palavras contidas no complemento.</li><li><b>Inicial:</b> busca lançamentos cujo complemento começa exatamente com o texto informado.</li><li><b>Complemento Original + Valor:</b> busca pelo complemento exato + valor exato.</li><li><b>Complemento Parcial + Valor:</b> busca por uma ou mais palavras do complemento + valor exato.</li></ul></li><li><b>Complemento</b> — critério para identificar os lançamentos que devem receber a contrapartida.</li><li><b>Conta contrapartida</b> — conta contábil usada no lançamento da contrapartida.</li><li><b>Histórico</b> — histórico aplicado automaticamente ao lançamento.</li><li><b>Participante</b> — quando aplicável, exibe o participante vinculado à regra.</li></ul><img src='https://tomticket-galeria.s3.amazonaws.com/42292/343253-1781114118450.png' alt='Visualização das contrapartidas'><h2>🛠️ Funcionalidade principal</h2><ul><li>Centralizar todas as contrapartidas configuradas.</li><li>Facilitar revisões e ajustes.</li><li>Evitar duplicidade ou conflito entre regras.</li><li>Permitir manutenção constante do plano de regras contábeis.</li></ul><h2>▶️ Como usar</h2><ol><li><b>Pesquise a regra desejada</b> usando os filtros superiores (empresa, complemento, conta, classificação ou regra).</li><li><b>Analise os dados da grade</b> — confira conta, complemento, tipo de regra, conta de contrapartida e histórico.</li><li><b>Remova regras incorretas</b> — marque a caixa de seleção e clique em <b>Remover</b> (canto superior direito).</li></ol><div class='bad'>⚠️ <b>Atenção — conflito de regras:</b> ao usar mais de uma regra (Original, Parcial ou Inicial), as regras <b>Parcial</b> e <b>Inicial</b> podem se sobrepor, e um mesmo lançamento ser identificado por mais de uma regra, gerando aplicações duplicadas. Mantenha regras claras, específicas e sem sobreposição.</div><h2>💡 Boas práticas</h2><ul><li>Mantenha os complementos objetivos e padronizados.</li><li>Evite palavras genéricas em regras do tipo Parcial.</li><li>Priorize regras Original quando a descrição for sempre igual.</li><li>Faça revisões periódicas para evitar duplicidade.</li><li>Use os filtros para identificar regras aplicadas incorretamente.</li></ul><h2>🧾 Quando utilizar</h2><ul><li>Auditar todas as contrapartidas cadastradas.</li><li>Identificar regras desnecessárias ou mal configuradas.</li><li>Garantir que não há conflitos entre regras.</li><li>Remover regras antigas.</li><li>Validar as contas contábeis usadas na automação.</li></ul><h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href='https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0' target='_blank' rel='noopener'>Atendimento Pilar Sistemas</a>.</p>"}]], "extrato": ["💼 Contábil › Extrato Bancário", [{"t": "Maquininha de Cartão de Crédito", "h": "<h2>📌 Visão geral</h2>\n<p>A funcionalidade <b>Maquininha de Cartão de Crédito</b> lê arquivos de transações de diversas operadoras (maquininhas), automatizando o lançamento contábil.</p>\n<h2>▶️ Passo 1 — Cadastrar a planilha</h2>\n<ul><li>Acesse <b>Planilhas</b> no menu lateral e clique em <b>Novo</b>.</li><li>Preencha os campos de cadastro (a seleção de uma <b>Conta contábil</b> é obrigatória).</li></ul>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/312461-1775474002307.png\" alt=\"Cadastro de planilha\">\n<ul><li>No campo <b>Tipo de arquivo</b>, escolha <b>Cartão de crédito</b>.</li></ul>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/311755-1775129960371.png\" alt=\"Tipo de arquivo Cartão de crédito\">\n<ul><li>Informe a <b>linha do cabeçalho</b>, adicione o arquivo do relatório da maquininha e, em <b>Configuração do relatório financeiro</b>, defina as colunas com <b>Tags</b>.</li></ul>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/311776-1775130865812.png\" alt=\"Configuração com tags\">\n<h2>▶️ Passo 2 — Configurar por empresa</h2>\n<ul><li>Acesse <b>Extrato Bancário</b> e clique na <b>engrenagem</b> no campo de Empresas.</li><li>Em <b>Configurações por empresa</b>, clique em <b>Cartão de crédito</b>.</li></ul>\n<div class=\"bad\">⚠️ A seleção de uma <b>Conta de valor líquido</b> e de uma <b>Conta de valor de tarifa</b> é obrigatória para a exportação.</div>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/312027-1775147349541.png\" alt=\"Configuração por empresa\">\n<ul><li>Se quiser, selecione um <b>Histórico de valor líquido</b> e um <b>Histórico de valor de tarifa</b>. Salve e feche.</li></ul>\n<h2>▶️ Passo 3 — Executar no extrato</h2>\n<ul><li>No <b>Extrato Bancário</b>, no campo de seleção de extrato, adicione o arquivo já configurado nas Planilhas.</li></ul>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/312049-1775150351637.png\" alt=\"Seleção do arquivo no extrato\">\n<ul><li>Clique em <b>Executar</b>. O relatório aparecerá conforme as configurações aplicadas.</li></ul>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/312471-1775474762287.png\" alt=\"Relatório executado\">\n<h2>💡 Dicas rápidas</h2>\n<ul>\n<li><b>Formatos aceitos:</b> XLS, XLSX, CSV ou PDF. Se o arquivo não for lido, fale com o Suporte para adicionarmos a configuração do seu layout.</li>\n<li><b>Tarifas:</b> não é preciso definir colunas de valor de tarifa nas Planilhas — o cálculo é automático.</li>\n<li><b>Contrapartidas:</b> os campos de contrapartida manual do Extrato não ficam disponíveis, pois as contrapartidas são aplicadas automaticamente pelas contas informadas na Configuração por Empresa.</li>\n</ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Desmembramento", "h": "<h2>📌 Visão geral</h2>\n<p>O <b>Desmembramento</b> permite dividir um lançamento do extrato em vários, distribuindo o valor entre contas contábeis diferentes.</p>\n<h2>⚙️ Parametrização de contas</h2>\n<p><b>Juros e desconto:</b> ao configurar uma conta de juros/desconto, ela é aplicada automaticamente nos lançamentos de Juro/Multa e Desconto, mesmo com origem em desmembramento. Ao remover, o sistema retira essas contas dos lançamentos vinculados, que voltam para o filtro <b>Sem Contrapartida</b>.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/281966-1756476289759.png\" alt=\"Parametrização de juros e desconto\">\n<p><b>Conta de boleto:</b> se houver uma conta Boleto usada em um lançamento desmembrado, ao excluí-la o sistema remove os desmembramentos.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/281967-1756476403520.png\" alt=\"Conta de boleto\">\n<p><b>Remover lançamento:</b> não é possível excluir lançamentos que sejam desmembramento — é preciso desfazer as alterações no lançamento original.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/281968-1756476475840.png\" alt=\"Remover lançamento\">\n<h2>❗ Quando posso desmembrar?</h2>\n<p>✅ <b>Permitido:</b> partida dobrada sem boleto (pelo valor pago/recebido); partida dobrada com boleto (apenas o valor original = pago − boleto); lançamentos com contrapartida configurada.</p>\n<p>🚫 <b>Não permitido:</b> valores de juros/multa ou desconto; valor pago/recebido em partidas simples; valores de boleto; lançamentos com duplicata vinculada.</p>\n<h2>📤 Exportação</h2>\n<p>Se o lançamento for desmembramento de partida simples ou tiver valor boleto, apenas os <b>filhos</b> são exportados. ⚠️ Contas transitórias não se aplicam a lançamentos desmembrados.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/281969-1756476722562.png\" alt=\"Exportação de desmembramento\">\n<h2>🔗 Duplicatas</h2>\n<ul>\n<li>Se já foi desmembrado, não é possível habilitar duplicata (e vice-versa).</li>\n<li>Para desmembrar, primeiro desvincule a duplicata.</li>\n<li>Ao vincular duplicata a um desmembramento, todos os filhos assumem origem <b>Duplicata</b>.</li>\n<li>Ao desvincular, o sistema volta à origem correta (Desmembramento, Extrato, Pagamento ou Recebimento).</li>\n</ul>\n<h2>📊 Tela de detalhamento</h2>\n<p><b>Campo Opção:</b> sem duplicata, seleciona “Desmembramento” automaticamente; com duplicata, fica aberto. O desmembramento só é habilitado no valor original; as duplicatas, no valor pago/recebido.</p>\n<p><b>Tabela de desmembramento:</b> o primeiro item é criado automaticamente; use ➕ para incluir novos (o sistema sugere o valor faltante) e 🗑️ para remover. Valores em aberto: 🔴 crédito faltando · 🟢 débito faltando. Botões: 💾 Salvar · ❌ Cancelar · 🔄 Desfazer alterações.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/281970-1756477216473.png\" alt=\"Tabela de desmembramento\">\n<h2>⚠️ Dicas extras</h2>\n<ul>\n<li>Lançamentos de boleto, juros ou desconto exibem: “Apenas o lançamento original não será exportado.”</li>\n<li>Só é permitido alterar contas, documento e complemento.</li>\n<li>Regras: pagamento desmembra só em débito; recebimento só em crédito; partida dobrada usa ambos (precisa fechar valores).</li>\n<li>Não é possível lançar débito e crédito na mesma linha, nem repetir a mesma conta bancária já configurada.</li>\n</ul>\n<h2>✅ Resumo rápido</h2>\n<ul><li>Não é possível apagar lançamentos desmembrados.</li><li>Duplicata vinculada bloqueia desmembramento (e vice-versa).</li><li>Apenas os filhos são exportados.</li><li>Lançamentos desmembrados aparecem em cinza, com dica de ajuda.</li><li>As regras de débito/crédito mudam conforme o tipo de lançamento.</li><li>Contas transitórias não se aplicam a desmembramentos.</li></ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Salvar Ponto de Trabalho", "h": "<h2>🎯 Visão geral</h2>\n<p>Este recurso permite <b>salvar o estado atual</b> da tela do Extrato Bancário, para você <b>continuar de onde parou</b>, mesmo com grandes volumes de dados. O salvamento pode ser <b>automático</b> (o sistema salva periodicamente) ou <b>manual</b> (você salva com um nome personalizado).</p>\n<h2>💡 Quando usar</h2>\n<ul><li>Ao interromper o trabalho no meio de uma análise.</li><li>Para não perder filtros, ordenações e dados selecionados.</li><li>Para retomar exatamente de onde parou.</li></ul>\n<h2>⚙️ Salvar como…</h2>\n<p>Disponível no menu <b>Mais opções</b>. Você pode <b>nomear</b> o ponto de trabalho para identificá-lo depois.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/333132-novooo2.png\" alt=\"Salvar como\">\n<h2>📂 Carregar</h2>\n<p>Acesse por <b>Mais opções › Carregar</b> para abrir pontos de trabalho salvos.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/293472-1765394913753.png\" alt=\"Carregar ponto de trabalho\">\n<p>Nesta tela você vê todos os pontos salvos (nome, status, usuário, data/hora e ações). O salvamento automático ocorre <b>a cada 3 minutos</b>, mesmo que você já tenha usado o “Salvar como”. Use a lixeira 🗑️ para remover.</p>\n<p><b>Status:</b></p>\n<ul><li><b>Manual</b> — salvo por você via “Salvar como”; cria um novo registro com a descrição definida.</li><li><b>Automático</b> — salvo a cada 3 minutos enquanto você está ativo; gera descrição automática e atualiza o salvamento anterior, sem duplicar.</li></ul>\n<p><b>Visibilidade:</b> você vê seus próprios pontos e, se preciso, os de outros usuários na aba <b>Todos</b>. <b>Busca</b> por nome do ponto ou do usuário.</p>\n<h2>📋 Dados salvos no contexto</h2>\n<ul><li>🏢 Empresa selecionada</li><li>📄 Nome do extrato (se houver)</li><li>🏦 Conta bancária selecionada</li><li>📅 Data inicial e final filtradas</li><li>📊 Grid do extrato, com todos os filtros e ordenações aplicados</li></ul>\n<h2>✅ Dicas rápidas</h2>\n<ul><li>Use nomes claros nos salvamentos manuais.</li><li>Confira periodicamente se o salvamento automático está atualizado.</li><li>Para recuperar, vá em <b>Mais opções › Carregar</b>.</li></ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Copiar contrapartida", "h": "<h2>📌 Visão geral</h2>\n<p>Essa funcionalidade copia as configurações de contrapartida entre empresas ou bancos, de forma rápida e segura — ideal para padronizar cadastros e agilizar processos.</p>\n<div class=\"bad\">⚠️ <b>Atenção:</b> só é possível copiar entre empresas que tenham o <b>mesmo plano de contas</b> cadastrado.</div>\n<h2>🧠 Campos principais</h2>\n<ul>\n<li><b>Tipo de cópia</b> — de <b>empresa para empresa</b> ou <b>por conta/banco</b>.</li>\n<li><b>Origem da cópia</b> — a empresa ou banco de onde as contrapartidas serão copiadas.</li>\n<li><b>Substituir as configurações existentes?</b> — se marcado, as contrapartidas do destino são <b>removidas</b> e substituídas pelas novas; se não, as novas são apenas <b>adicionadas</b>, mantendo as existentes.</li>\n</ul>\n<h2>🚀 Passo a passo</h2>\n<ol>\n<li>No <b>Tipo de cópia</b>, selecione <b>Empresa para empresa</b> ou <b>Banco para banco</b>.</li>\n<li>Na <b>Origem da cópia</b>, escolha a empresa ou banco de onde os dados serão copiados.</li>\n<li>Se desejar, marque <b>Substituir as configurações do destino</b> (isso apaga as contrapartidas já existentes lá).</li>\n<li>Clique em <b>Confirmar</b> para executar (ou <b>Cancelar</b> para sair sem salvar).</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270492-1749959604284.png\" alt=\"Tela de copiar contrapartida\">\n<h2>💡 Dicas importantes</h2>\n<ul><li>Verifique se o plano de contas é o mesmo entre origem e destino.</li><li>Use a opção de substituir apenas quando quiser uma atualização total.</li><li>Revise antes de confirmar — a substituição apaga os dados antigos.</li></ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Saldo na Tela de Extrato (Open Finance)", "h": "<h2>🎯 Visão geral</h2>\n<p>Este recurso adiciona a coluna <b>Saldo</b> na tela de contas bancárias do módulo Open Finance, permitindo ver rapidamente o <b>saldo mais recente</b> de cada conta — sem precisar acessar o app do banco ou o internet banking.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/276487-1753355940886.png\" alt=\"Coluna Saldo nas contas Open Finance\">\n<h2>⚙️ Na tela Open Finance</h2>\n<p>O saldo é considerado e atualizado quando estiverem preenchidos: <b>Data do saldo inicial</b>, <b>Saldo inicial</b> e o status da conta em <b>Conectado</b>.</p>\n<div class=\"bad\">📌 A data do saldo inicial não pode ser inferior a 12 meses da data atual, nem maior que a data atual.</div>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/276488-1753356457113.png\" alt=\"Configuração do saldo inicial\">\n<h2>⚙️ Na tela Extrato Bancário</h2>\n<p>Ao selecionar uma conta Open Finance já com o saldo configurado, aparece um novo campo na tela.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/276489-1753356845329.png\" alt=\"Novo campo de saldo no extrato\">\n<p>Há também uma nova opção de exportação: <b>Extrato Bancário com Saldo</b>.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/276491-1753357266792.png\" alt=\"Exportação com saldo\">\n<p>No relatório, os valores são apresentados com fidelidade à movimentação bancária, com a composição de saldo conforme os lançamentos.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/276492-1753357961807.png\" alt=\"Relatório de extrato com saldo\">\n<h2>💡 Dicas rápidas</h2>\n<ul>\n<li><b>Saldo sempre atualizado</b> — atualiza a cada nova consulta de transações.</li>\n<li><b>Data obrigatória</b> — no saldo manual, dentro dos últimos 12 meses.</li>\n<li><b>Conta desconectada?</b> — o saldo aparece como “---” ou com ícone de aviso; reconecte para atualizar.</li>\n<li><b>Ordenação</b> — dá pra ordenar os saldos para comparar contas.</li>\n<li><b>Exportação fiel</b> — o extrato exportado mostra os valores como estão no banco, sem ajustes.</li>\n</ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Empresas › Contas Transitórias", "h": "<h2>🎯 Visão geral</h2>\n<p>Este recurso permite configurar contas contábeis <b>transitórias</b>, usadas <b>apenas na exportação</b> dos lançamentos pelo <b>Layout Padrão Automation</b>. É a solução para <b>lançamentos sem contrapartida</b> — quando falta o débito ou o crédito.</p>\n<h2>🎯 Objetivo</h2>\n<p>Parametrizar contas transitórias <b>por empresa</b>, garantindo que nenhum lançamento fique incompleto na exportação. A configuração <b>não altera os lançamentos internos</b> — impacta apenas o arquivo exportado.</p>\n<h2>🧩 Onde configurar</h2>\n<p>Em <b>⚙️ Configuração por Empresa › aba Contas Transitórias</b>.</p>\n<h2>🔁 Como usar</h2>\n<ul><li>As configurações são individuais por empresa.</li><li>Só se aplicam no momento da exportação — nenhum lançamento é alterado no sistema.</li><li>Também é possível configurar <b>históricos</b>, habilitados somente quando uma conta transitória é adicionada.</li></ul>\n<h2>📤 No momento da exportação</h2>\n<p>O sistema faz uma validação automática:</p>\n<ol><li>Verifica se há contrapartida no lançamento (débito e crédito).</li><li>Se faltar: usa a <b>Conta Transitória Débito</b> quando falta o débito, ou a <b>Conta Transitória Crédito</b> quando falta o crédito.</li></ol>\n<h2>✅ Benefícios</h2>\n<ul><li>Evita falhas e interrupções na exportação.</li><li>Garante um layout sempre completo e padronizado.</li><li>Dá autonomia ao operador.</li><li>Centraliza as regras por empresa, com rastreabilidade.</li></ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Empresas › Configuração de exportação", "h": "<h2>📌 Visão geral</h2>\n<p>Nas configurações por empresa, a <b>Configuração de Exportação</b> define como os <b>complementos</b> serão exportados para a contabilidade. O recurso padroniza os textos e evita erros de leitura no sistema contábil.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/285367-1759090431326.png\" alt=\"Configuração de exportação\">\n<h2>⚙️ Formatação do complemento</h2>\n<p>Você escolhe como o texto dos complementos será exportado:</p>\n<ul>\n<li>🔠 <b>Tudo maiúsculo</b> — exemplo: <i>TRANSFERÊNCIA BANCÁRIA</i>.</li>\n<li>🔡 <b>Tudo minúsculo</b> — exemplo: <i>transferência bancária</i>.</li>\n<li>🅰️ <b>Primeira letra maiúscula, restante minúsculo</b> — exemplo: <i>Transferência bancária</i>.</li>\n</ul>\n<h2>▶️ Passo a passo</h2>\n<ol>\n<li>No menu à esquerda, clique em <b>Extrato Bancário</b>.</li>\n<li>Na engrenagem do campo <b>Empresas</b>, abra <b>Configurações por empresa</b>.</li>\n<li>Clique em <b>Configuração de Exportação</b>.</li>\n<li>No campo <b>Formato do complemento</b>, escolha uma das três opções.</li>\n<li>Clique em <b>Salvar</b> (ou <b>Cancelar</b> para não aplicar).</li>\n</ol>\n<h2>💡 Dicas</h2>\n<ul>\n<li>Se sua contabilidade exige padrão em maiúsculo, selecione <b>Tudo maiúsculo</b>.</li>\n<li>A configuração vale para todas as exportações futuras.</li>\n<li>Esta aba define apenas a padronização de texto — não altera valores nem outras informações da exportação.</li>\n</ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Extrato Bancário (módulo)", "h": "<h2>📌 Visão geral</h2>\n<p>O módulo <b>Extrato Bancário</b> permite visualizar, organizar e tratar os lançamentos financeiros importados do banco, facilitando a conciliação contábil e financeira da empresa.</p>\n<h2>🚀 Funcionalidades principais</h2>\n<ul>\n<li>Seleção de empresa e extrato bancário.</li>\n<li>Filtro por período.</li>\n<li>Busca por conta, classificação ou nome.</li>\n<li>Visualização dos lançamentos (Data, Débito, Crédito, Valor, Documento, Complemento, Origem).</li>\n<li>Identificação de lançamentos com ou sem contrapartida.</li>\n<li>Aplicação de regras e complementos.</li>\n<li>Opções para salvar, exportar ou remover informações.</li>\n</ul>\n<h2>1️⃣ Selecionar a empresa e o extrato</h2>\n<p>No campo <b>Empresa</b>, selecione a empresa desejada. No campo <b>Extrato Bancário</b>, selecione o extrato a analisar.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270484-1749950087540.png\" alt=\"Seleção de empresa\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270485-1749950237423.png\" alt=\"Seleção de extrato bancário\">\n<h2>2️⃣ Definir o período</h2>\n<p>Preencha o <b>período inicial</b> e o <b>período final</b> para filtrar os lançamentos. No caso do Open Finance, esses campos são obrigatórios.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270483-1749949843500.png\" alt=\"Definição de período\">\n<h2>3️⃣ Documento auxiliar</h2>\n<p>Depois de selecionar empresa, extrato e período, você pode usar o botão <b>Documento auxiliar</b>.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/291074-1763744920685.png\" alt=\"Documento auxiliar\">\n<p>Permite anexar documentos complementares que apoiam a conferência, conciliação e análise dos lançamentos — como comprovantes de pagamento e recebimento, relatórios de movimentações e de duplicatas. Eles ajudam na validação e no cruzamento entre extrato e documentos de suporte.</p>\n<p><b>Como usar:</b> clique em <b>Documento Auxiliar</b> e arraste ou selecione os arquivos para anexá-los ao lançamento desejado.</p>\n<div class=\"ok\">💡 Anexar documentos não é obrigatório, mas facilita muito a conferência.</div>\n<h2>4️⃣ Mais opções</h2>\n<p>Acessa funcionalidades complementares para o tratamento dos lançamentos:</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/291071-1763744076006.png\" alt=\"Mais opções\">\n<table>\n<thead><tr><th>Opção</th><th>Descrição</th></tr></thead>\n<tbody>\n<tr><td>💾 Salvar como / Salvar / Carregar</td><td>Opções para salvar o ponto de trabalho (ver artigo “Salvar Ponto de Trabalho”).</td></tr>\n<tr><td>📑 Copiar contrapartida</td><td>Copia a contrapartida de um lançamento para outros, agilizando o preenchimento (ver artigo “Copiar contrapartida”).</td></tr>\n<tr><td>⚙️ Comprovantes</td><td>Configura os complementos dos comprovantes após o vínculo com o extrato bancário.</td></tr>\n</tbody>\n</table>\n<h2>5️⃣ Remover</h2>\n<p><b>Excluir lançamentos selecionados</b> remove temporariamente os lançamentos da visualização — eles não serão exportados, mas ao recarregar o extrato voltam a aparecer normalmente.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/308615-Screenshot_34.png\" alt=\"Remover lançamentos\">\n<h2>6️⃣ Visualização dos lançamentos</h2>\n<p>Na grade central aparecem as colunas: <b>Data, Débito, Crédito, Valor, Documento, Complemento, Origem</b> e <b>Histórico</b>.</p>\n<div class=\"bad\">⚠️ Se aparecer “Nenhuma informação encontrada”, verifique se a empresa e o extrato estão corretamente selecionados e se o período informado possui lançamentos.</div>\n<h2>7️⃣ Contrapartidas</h2>\n<p>À direita, indicadores mostram quantos lançamentos ainda <b>não possuem contrapartida</b> e quantos <b>já estão configurados</b> — servindo como apoio visual e filtro.</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/308617-Screenshot_35.png\" alt=\"Indicadores de contrapartida\">\n<p>Para configurar a contrapartida, use o campo <b>Regra</b>, que define como o sistema identifica os lançamentos:</p>\n<ul>\n<li><b>Complemento original</b> — aplica apenas a lançamentos com complemento exatamente igual ao texto informado.</li>\n<li><b>Complemento parcial</b> — informe uma ou mais palavras; aplica a lançamentos que contenham pelo menos uma delas.</li>\n<li><b>Complemento inicial</b> — aplica a lançamentos cujo complemento comece exatamente com o texto informado.</li>\n<li><b>Complemento original + valor</b> — aplica apenas quando complemento e valor forem exatamente iguais.</li>\n<li><b>Complemento parcial + valor</b> — aplica a lançamentos com valor exato e pelo menos uma das palavras informadas.</li>\n</ul>\n<div class=\"bad\">⚠️ <b>Regras múltiplas:</b> ao usar mais de uma regra, evite conflitos. “Complemento parcial” e “Complemento inicial” podem se sobrepor. Mantenha as regras claras, específicas e não conflitantes.</div>\n<p><b>🚫 Ignorar lançamento(s):</b> quando ativado, os lançamentos selecionados são totalmente desconsiderados — não são exportados, não geram contrapartidas e não podem ser desmembrados. Para reverter, acesse a aba <b>Ignorados</b> (o filtro só é ativado após pelo menos uma configuração).</p>\n<p><b>🗒️ Complemento (Extrato):</b> texto original do lançamento importado. <b>🔀 Conta de contrapartida a débito:</b> selecione a conta contábil de contrapartida.</p>\n<p><b>🗨 Levar complemento vazio:</b> quando ativado, o complemento não é exportado e o campo <b>Histórico</b> passa a ser obrigatório; o complemento continua visível na grid, mas não entra na exportação.</p>\n<p><b>✍️ Complemento (Novo):</b> texto aplicado ao novo lançamento gerado. <b>📜 Histórico:</b> selecione ou digite o histórico desejado.</p>\n<p>Clique em <b>Salvar/Próximo</b> para registrar e avançar, ou <b>Cancelar</b> para descartar.</p>\n<h2>8️⃣ Exportar</h2>\n<p>Gera relatórios ou exportações dos dados da grade nos formatos:</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/270491-1749951747870.png\" alt=\"Formatos de exportação\">\n<table>\n<thead><tr><th>Formato</th><th>Descrição</th></tr></thead>\n<tbody>\n<tr><td>📄 Layout Padrão Automation</td><td>Arquivo específico para integração com o seu sistema contábil.</td></tr>\n<tr><td>📊 Excel (XLS)</td><td>Formato mais antigo, compatível com versões anteriores.</td></tr>\n<tr><td>📊 Excel (XLSX)</td><td>Formato atual do Excel.</td></tr>\n<tr><td>📑 CSV</td><td>Texto separado por vírgula, compatível com diversos sistemas, bancos e planilhas.</td></tr>\n<tr><td>🔗 OFX</td><td>Formato bancário padrão para importar ou integrar dados com outros sistemas financeiros.</td></tr>\n</tbody>\n</table>\n<div class=\"ok\">💡 Escolha o formato que melhor se adapta à necessidade — relatório interno, importação em outro sistema ou armazenamento.</div>\n<h2>💡 Dicas úteis</h2>\n<ul>\n<li>Use os filtros no topo da grade para localizar lançamentos por data, débito, crédito, valor, documento, complemento ou origem.</li>\n<li>A busca rápida (topo direito) localiza lançamentos por conta, classificação ou nome.</li>\n<li>Confira sempre os lançamentos sem contrapartida para evitar erros na conciliação.</li>\n</ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Leitura de Múltiplos Extratos", "h": "<h2>📌 Visão geral</h2>\n<p>Esta funcionalidade permite <b>importar múltiplos extratos</b> de uma só vez, dando mais flexibilidade ao processo e possibilitando um número maior de lançamentos em uma única operação.</p>\n<h2>▶️ Passo a passo</h2>\n<ol>\n<li>Acesse <b>Rotina Contábil › Extrato Bancário</b>.</li>\n<li>Selecione a <b>empresa</b>.</li>\n<li>Selecione <b>um ou mais extratos</b> para a rotina.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/336447-Screenshot_39.png\" alt=\"Seleção de múltiplos extratos\">\n<ol start=\"4\">\n<li>Selecione a conta bancária e clique em <b>Executar</b>.</li>\n<li>O sistema importará todos os lançamentos dos extratos anexados.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/336453-Screenshot_42.png\" alt=\"Lançamentos importados\">\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/336455-Screenshot_43.png\" alt=\"Quantidade de extratos anexados\">\n<p>O sistema exibe a quantidade de extratos anexados.</p>\n<h2>💡 Dicas rápidas</h2>\n<ul>\n<li>Com mais de um extrato, o sistema reconhece tanto os enviados pelo banco (PDF e OFX) quanto os cadastrados na rotina de planilhas.</li>\n<li>O sistema <b>não aceita</b>: extrato de maquininha de cartão, extrato sem conta bancária e lançamentos importados via Open Finance.</li>\n</ul>\n<div class=\"bad\">⚠️ <b>Observação:</b> os arquivos auxiliares são aceitos normalmente mesmo com mais de um extrato. Tenha atenção, pois o sistema pode anexar arquivos a lançamentos não desejados.</div>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Extrato sem conta banco", "h": "<h2>👀 Visão geral</h2>\n<p>Esta funcionalidade permite cadastrar planilhas <b>sem definir previamente uma conta bancária</b>, dando mais flexibilidade ao processo. A vinculação das contas é feita diretamente na tela de extrato, permitindo determinar, de forma prática e precisa, qual conta contábil será atribuída a cada lançamento.</p>\n<h2>▶️ Passo a passo (cadastro da planilha)</h2>\n<ol>\n<li>No menu à esquerda, clique em <b>Planilhas</b>.</li>\n<li>Clique em <b>Novo</b>.</li>\n<li>Na tela de <b>Cadastro de Planilhas</b>, preencha os campos de configuração.</li>\n<li>No campo <b>Tipo de arquivo</b>, escolha <b>Extrato sem conta banco</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/317736-Screenshot_80.png\" alt=\"Tipo de arquivo: extrato sem conta banco\">\n<ol start=\"5\">\n<li>Informe a <b>linha do cabeçalho</b> do seu relatório.</li>\n<li>Adicione o <b>arquivo sem conta banco</b>.</li>\n<li>Após o carregamento, em <b>Configuração do relatório financeiro</b>, defina as colunas usando as <b>Tags</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/317738-Screenshot_81.png\" alt=\"Configuração do relatório com tags\">\n<h2>📥 Carregando na tela de Extrato Bancário</h2>\n<ol>\n<li>Acesse <b>Contábil › Extrato Bancário</b>.</li>\n<li>Selecione a empresa e escolha o extrato configurado no cadastro de planilhas.</li>\n<li>Após executar, os lançamentos aparecem na tela. Ao selecionar um lançamento, os campos à direita são liberados.</li>\n</ol>\n<h2>🔁 Para aplicar contrapartida</h2>\n<ol>\n<li>Com um lançamento selecionado, informe os campos de <b>débito</b> e <b>crédito</b> (a mesma conta não pode ser aplicada para ambos ⚠️).</li>\n<li>Após configurar as contrapartidas, o lançamento aparece na aba <b>Com contrapartida/duplicata</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/317745-Screenshot_82.png\" alt=\"Aplicando contrapartida\">\n<h2>💡 Dicas rápidas</h2>\n<ul>\n<li>Nesta rotina não é possível selecionar uma conta banco.</li>\n<li>Certifique-se de preencher os campos de crédito e débito.</li>\n<li>Não é possível adicionar documento auxiliar.</li>\n</ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Planilhas (execução na tela)", "h": "<h2>📌 Visão geral</h2>\n<p>Este guia mostra como <b>executar planilhas</b> já cadastradas no Automation, tanto <b>por empresa</b> (planilha específica) quanto <b>por sistema (geral)</b>. A execução carrega os lançamentos na grid para configuração de contrapartidas e continuidade do processo contábil.</p>\n<div class=\"ok\">🔗 Relacionados: <b>Cadastros › Planilhas</b> (cadastro e configuração) e <b>Contábil › Extrato Bancário</b> (padrão da tela).</div>\n<h2>✅ Pré-requisitos</h2>\n<ul>\n<li>A planilha foi <b>cadastrada e ativada</b> (por empresa ou por sistema financeiro – geral).</li>\n<li><b>Tipo de arquivo = Extrato</b> (somente esse tipo aparece na listagem de execução).</li>\n<li><b>Layout idêntico</b> ao cadastrado (mesmas colunas).</li>\n<li><b>Linha do cabeçalho</b> definida corretamente no cadastro.</li>\n</ul>\n<h2>🧭 Onde fica</h2>\n<p>Cadastrar/validar: <b>Cadastros › Planilhas</b>. Executar: <b>Contábil › Extrato Bancário</b>.</p>\n<h2>▶️ Execução — planilha específica (por empresa)</h2>\n<ol>\n<li>Selecione a empresa que já tem a planilha configurada.</li>\n<li>No campo <b>Selecione um extrato bancário</b>, o sistema lista as planilhas de Extrato configuradas para aquela empresa e seus sistemas, além da opção <b>Arquivo Extrato bancário (PDF, OFX, XLS…)</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/289192-1761742629200.png\" alt=\"Seleção de planilha específica\">\n<ol start=\"3\">\n<li>Escolha a planilha e selecione o arquivo a ser lido.</li>\n<li>Clique em <b>Executar</b>: os lançamentos aparecem na grid para configurar as contrapartidas.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/289191-1761742588766.png\" alt=\"Lançamentos na grid\">\n<p><b>Regras:</b> o conteúdo do arquivo não precisa ser o mesmo da configuração, mas o <b>layout deve ser idêntico</b> (mesmas colunas). Apenas <b>Tipo = Extrato</b> aparece na lista. Arquivos de Pagamento/Recebimento/Movimentação podem ser anexados como documentos auxiliares — o sistema reconhece o tipo pela estrutura.</p>\n<h2>▶️ Execução — planilha por sistema (geral)</h2>\n<p>Use quando quiser reaproveitar uma configuração para várias empresas que usam o mesmo ERP/sistema.</p>\n<ol>\n<li>Garanta que a planilha está cadastrada com <b>Relatório por = Sistema Financeiro (Geral)</b>.</li>\n<li>Na tela de Extrato Bancário, selecione qualquer empresa.</li>\n<li>No campo <b>Selecione um extrato bancário</b>, o sistema lista as planilhas de Extrato por sistema (visíveis para todas as empresas), além da opção de arquivo padrão.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/289194-1761742901834.png\" alt=\"Planilha por sistema\">\n<ol start=\"4\">\n<li>Escolha a planilha por sistema e selecione o arquivo.</li>\n<li>Clique em <b>Executar</b> para carregar os lançamentos e seguir com as contrapartidas.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/289196-1761743080405.png\" alt=\"Execução por sistema\">\n<p><b>Regras:</b> layout idêntico (mesmas colunas e ordem); apenas <b>Tipo = Extrato</b> aparece; auxiliares reconhecidos pela estrutura.</p>\n<h2>💡 Dicas e boas práticas</h2>\n<ul>\n<li>Se a planilha não aparecer: confira se o <b>Tipo = Extrato</b> e se todas as colunas do arquivo estão corretas (colunas excluídas na configuração também são consideradas na leitura).</li>\n<li>Erros de leitura geralmente vêm de colunas diferentes ou cabeçalho em linha incorreta — ajuste o cadastro.</li>\n<li>Nos arquivos auxiliares, mantenha o padrão de colunas para o sistema reconhecer Pagamento/Recebimento/Movimentação.</li>\n</ul>\n<h2>🧩 Erros comuns</h2>\n<ul>\n<li><b>Planilha não listada</b> → checar Tipo (Extrato) e ativação por empresa/sistema.</li>\n<li><b>Leitura parcial / colunas trocadas</b> → validar ordem e nomes das colunas e a linha do cabeçalho.</li>\n<li><b>Lançamentos sem conta</b> → usar fallback por sistema (se aplicável) e revisar mapeamentos.</li>\n</ul>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "Arquivos aceitos pelo sistema (PDF texto)", "h": "<h2>👀 Visão geral</h2><p>Este guia mostra como identificar se o extrato bancário está no formato adequado para importação no Automation. Extratos gerados pela opção <b>Imprimir</b> costumam ser salvos como <b>imagem</b>, o que impede a leitura pelo sistema. O formato correto é o <b>PDF em texto</b> — aquele em que é possível <b>selecionar e copiar</b> o conteúdo.</p><h2>📝 Como verificar se o PDF está no formato correto</h2><ol><li>Abra o arquivo PDF no computador.</li><li>Pressione <b>Ctrl + A</b> para selecionar todo o conteúdo.</li><li>Pressione <b>Ctrl + C</b> para copiar.</li><li>Abra o Bloco de Notas (ou qualquer editor de texto).</li><li>Pressione <b>Ctrl + V</b> para colar.</li></ol><div class='ok'>✅ <b>Se o texto aparecer no Bloco de Notas:</b> o extrato está no formato correto (PDF texto) e poderá ser processado pelo sistema.</div><div class='bad'>❌ <b>Se nada for colado ou aparecer apenas uma imagem:</b> o extrato está em formato de imagem e não será lido pelo sistema.</div><h2>📌 Como solicitar o extrato corretamente ao cliente</h2><p>Oriente o cliente a:</p><ul><li>Não usar a opção <b>Imprimir</b>.</li><li>Procurar, no site ou aplicativo do banco, a opção <b>Download</b> ou <b>Exportar</b> em PDF.</li><li>Em caso de dúvida, solicitar ao gerente ou ao suporte do banco um <b>PDF em texto</b>.</li></ul><h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href='https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0' target='_blank' rel='noopener'>Atendimento Pilar Sistemas</a>.</p>"}]], "notas": ["🧾 Fiscal › Notas", [{"t": "CT-e", "h": "<h2>📌 Visão geral</h2>\n<p>O módulo <b>CT-e</b> do Automation disponibiliza os conhecimentos de transporte eletrônico (CT-e) emitidos na competência atual de todos os estados brasileiros. As consultas são feitas automaticamente, todos os dias.</p>\n<h2>🖥️ Tela CT-e</h2>\n<p>Acesse por <b>Fiscal › Notas › CT-e</b>. Opções de busca: Razão Social ou CNPJ/CPF, Status, Competência inicial e final, e o botão <b>Baixa em Lote</b> (download de várias empresas ao mesmo tempo).</p>\n<p>A lista de empresas exibe: Status de execução, Competência, Status por processo (Entradas e Saídas), Última consulta (“Consultado em”) e Ações (download e histórico).</p>\n<h2>📊 Detalhamento dos status</h2>\n<table>\n<thead><tr><th>Status</th><th>Descrição</th><th>O que fazer?</th></tr></thead>\n<tbody>\n<tr><td>Sucesso</td><td>O sistema conseguiu baixar ao menos uma nota (entrada ou saída).</td><td>Nenhuma ação necessária.</td></tr>\n<tr><td>Em execução</td><td>A baixa da nota está sendo processada naquele momento.</td><td>Aguardar a conclusão.</td></tr>\n<tr><td>Aguardando execução</td><td>A fila de processamento diário foi iniciada.</td><td>Aguardar a conclusão.</td></tr>\n<tr><td>Reagendado</td><td>O sistema não conseguiu baixar as notas e tentará novamente automaticamente.</td><td>Monitorar; se persistir, verifique o certificado e as configurações.</td></tr>\n<tr><td>Erro</td><td>Ocorreu uma inconsistência não mapeada.</td><td>Contate o suporte informando a empresa e a competência.</td></tr>\n<tr><td>Certificado vencido</td><td>O certificado digital da empresa está vencido.</td><td>Renove o certificado e recadastre-o no sistema.</td></tr>\n</tbody>\n</table>\n<p><b>Colunas Entradas e Saídas</b> — status de cada processo: 🟢 verde = CT-e baixado com sucesso · 🔴 vermelha = inconsistência na baixa · ⚫ cinza = sem CT-e na competência.</p>\n<h2>🛠️ Configurações necessárias</h2>\n<p>Para o sistema baixar as notas, é preciso configurar o certificado digital da empresa:</p>\n<ol>\n<li>Acesse <b>Cadastro › Certificados</b>.</li>\n<li>Adicione um novo certificado ou edite um existente.</li>\n<li>Na aba <b>Dados</b>, adicione o certificado digital <b>A1</b> e vincule-o à empresa correspondente.</li>\n<li>Na aba <b>Rotinas Vinculadas</b>, na esfera <b>Estadual</b>, selecione a rotina <b>Sefaz</b> e defina o estado da empresa.</li>\n<li>Clique no <b>check</b> e em <b>Salvar</b>.</li>\n</ol>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/344599-2026-06-12%2015-48-07%20%281%29.gif\" alt=\"Configuração do certificado para CT-e\">\n<div class=\"bad\">⚠️ <b>Regras do certificado:</b> não é permitido usar procuração; o certificado deve ser da própria empresa selecionada; em matriz e filial, cadastre um certificado por empresa (o vínculo é por CNPJ — o da matriz não vale para a filial e vice-versa); empresas sem certificado cadastrado não terão as notas consultadas.</div>\n<h2>💬 Suporte</h2><p>Em caso de dúvidas, fale com a gente: <a href=\"https://api.whatsapp.com/send/?phone=554733809494&text&type=phone_number&app_absent=0\" target=\"_blank\" rel=\"noopener\">Atendimento Pilar Sistemas</a>.</p>\n"}, {"t": "NF-e", "h": "<h2>📌 Visão geral</h2>\n<p>O módulo <b>NF-e</b> do Automation disponibiliza as notas fiscais de produto (NF-e) emitidas na competência atual de todos os estados brasileiros. As consultas são feitas automaticamente, todos os dias.</p>\n<h2>🖥️ Tela NF-e</h2>\n<p>Acesse por <b>Fiscal › Notas › NF-e</b>. Opções de busca: Razão Social ou CNPJ/CPF, Status, Competência inicial e final, e o botão <b>Baixa em Lote</b> (download de várias empresas ao mesmo tempo).</p>\n<p>A lista de empresas exibe: Status de execução, Competência, Status por processo (Entradas e Saídas), Última consulta (“Consultado em”) e Ações (download e histórico).</p>\n<img src=\"https://tomticket-galeria.s3.amazonaws.com/42292/344600-nfe%20%281%29.gif\" alt=\"Tela NF-e\">\n<h2>📊 Detalhamento dos status</h2>\n<table>\n<thead><tr><th>Status</th><th>Desc
